            border-left: 2.5px solid #4f46e5;

        @media print {
            body {
                background-color: #ffffff !important;

            .day-btn, header button, header a, .noclick, button, select {

</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col select-none p-3 md:p-6 gap-4 md:gap-5">

    <!-- Header Corporativo Claro Premium -->

        <!-- Bloque de Firma de Autoría e Iconos de Contacto -->
        <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto gap-4 bg-slate-50 border border-slate-200 px-4 py-2 rounded-xl">
            <span class="text-xs font-black text-slate-700 tracking-wide font-mono">MARCⓊ DAVILA</span>
            <div class="w-px h-4 bg-slate-200 hidden sm:block"></div>
            <div class="flex items-center gap-3">
                <a href="https://wa.me/51946397037" target="_blank" class="p-1 text-slate-500 hover:text-emerald-600 transition-colors cursor-pointer" title="Contactar por WhatsApp">
                    <i data-lucide="message-circle" class="w-4 h-4"></i>
                </a>
                <a href="https://teams.microsoft.com/l/chat/0/0?users=mdavilab@sigma-alimentos.com" target="_blank" class="p-1 text-slate-500 hover:text-blue-600 transition-colors cursor-pointer" title="Contactar por Microsoft Teams">
                    <i data-lucide="users" class="w-4 h-4"></i>

                <div class="w-px h-3 bg-slate-200"></div>
                <button onclick="shareDashboard()" class="p-1 text-slate-500 hover:text-indigo-600 transition-colors cursor-pointer" title="Compartir Dashboard">

    <!-- FILA 1: CALENDARIO + TARJETAS MÁSTER SUPERIORES -->
    <div class="w-full shrink-0 overflow-x-auto overflow-y-hidden custom-scrollbar pb-1">
        <section class="flex flex-row flex-nowrap gap-3 items-start justify-between w-full min-w-[1180px]">
            <!-- Calendario -->
            <div class="w-[230px] shrink-0 bg-white border border-slate-200 rounded-2xl p-3 shadow-xs flex flex-col justify-between">
                <div class="flex items-center justify-between mb-1.5 border-b border-slate-200 pb-1">
                    <span class="text-[10px] font-black uppercase tracking-wider text-slate-500">Julio 2026</span>
                    <button id="btnDayAll" onclick="selectDiaCalendario('ALL')" class="text-[9px] bg-slate-100 text-indigo-600 hover:bg-slate-200 font-bold px-1.5 py-0.5 rounded border border-slate-200 transition-colors cursor-pointer">
                        Todo el mes

                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-[9px] font-bold text-slate-400 mb-1">
                    <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                </div>
                <div id="calendarGrid" class="grid grid-cols-7 gap-0.5"></div>
            </div>

            <!-- Contenedores estáticos de las 4 Tarjetas Máster -->
            <div id="card-Global" class="w-[215px] shrink-0 bg-white border border-slate-200 rounded-2xl p-3.5 shadow-xs flex flex-col justify-between transition-all duration-200 cursor-pointer"></div>
            <div id="card-Chancay" class="w-[215px] shrink-0 bg-white border border-slate-200 rounded-2xl p-3.5 shadow-xs flex flex-col justify-between transition-all duration-200 cursor-pointer"></div>
            <div id="card-Ate1" class="w-[215px] shrink-0 bg-white border border-slate-200 rounded-2xl p-3.5 shadow-xs flex flex-col justify-between transition-all duration-200 cursor-pointer"></div>
            <div id="card-Ate2" class="w-[215px] shrink-0 bg-white border border-slate-200 rounded-2xl p-3.5 shadow-xs flex flex-col justify-between transition-all duration-200 cursor-pointer"></div>
        </section>
    </div>

    <!-- FILA 2: GRÁFICO DE EVOLUCIÓN CON DOBLE EJE -->
    <section class="bg-white p-3 md:p-4 rounded-2xl border border-slate-200 shadow-xs flex flex-col h-[200px] md:h-[230px] w-full">
        <div class="w-full flex-1 min-h-0 relative">
            <canvas id="chartTrend"></canvas>
        </div>
    </section>

    <!-- FILA 3: SEGUNDA LÍNEA DE CARDS DE DETALLE CRÍTICO INTERACTIVO -->
    <div class="w-full shrink-0 overflow-x-auto overflow-y-hidden custom-scrollbar pb-1">
        <section class="flex flex-row flex-nowrap gap-3 items-start justify-between w-full min-w-[1180px]">
            <div id="subcard-motivo" class="flex-1 min-w-[275px] bg-white border border-slate-200 rounded-2xl p-3.5 shadow-xs transition-all"></div>
            <div id="subcard-vehiculo" class="flex-1 min-w-[275px] bg-white border border-slate-200 rounded-2xl p-3.5 shadow-xl transition-all"></div>
            <div id="subcard-ruta" class="flex-1 min-w-[275px] bg-white border border-slate-200 rounded-2xl p-3.5 shadow-xl transition-all"></div>
            <div id="subcard-distrito" class="flex-1 min-w-[275px] bg-white border border-slate-200 rounded-2xl p-3.5 shadow-xl transition-all"></div>
        </section>
    </div>

    <!-- FILA 4: TABLA MAESTRA CONSOLIDADA Y MAPA PARALELO CLARO -->
    <section class="flex flex-col lg:flex-row gap-4 items-stretch w-full min-h-[380px]">
        <div class="w-full lg:w-[65%] bg-white border border-slate-200 rounded-2xl p-3 md:p-4 flex flex-col justify-between shadow-xs min-w-0">
            <div>
                <div class="flex items-center justify-between mb-3 border-b border-slate-200 pb-2">
                    <button onclick="downloadExcelComas()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[10.5px] font-black py-1.5 px-3 rounded-lg flex items-center gap-2 cursor-pointer shadow-xs transition-all select-none">
                        <i data-lucide="download" class="w-3.5 h-3.5"></i>
                        Exportar Excel
                    </button>
                    <span id="table-view-status" class="text-[9px] font-mono text-slate-400"></span>
                </div>
                <div class="overflow-x-auto custom-scrollbar max-h-[290px]">
                    <table class="w-full text-left border-collapse text-[11px] font-mono text-slate-700">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 font-bold border-b border-slate-200">
                                <th class="p-2 text-indigo-600 font-bold">Fecha</th>
                                <th class="p-2">Código</th>
                                <th class="p-2 truncate max-w-[140px]">Cliente</th>
                                <th class="p-2">Ruta</th>
                                <th class="p-2">Canal</th>
                                <th class="p-2">Vehículo</th>
                                <th class="p-2 truncate max-w-[110px]">Motivo</th>
                                <th class="p-2 text-right">Surtido</th>
                                <th class="p-2 text-right text-rose-600">Rechazado</th>
                            </tr>
                        </thead>
                        <tbody id="masterTableBody" class="divide-y divide-slate-100 text-slate-700"></tbody>
                    </table>
                </div>
            </div>
            <button onclick="toggleTableExpansion()" class="w-full border-t border-slate-200 mt-2 pt-1.5 flex items-center justify-between text-[10px] font-bold uppercase tracking-wider text-slate-400 hover:text-indigo-600 transition-colors cursor-pointer font-mono">
                <span id="btnTableText">Ver Todos los Despachos</span>
                <span id="btnTableArrow">▼</span>
            </button>
        </div>

        <div class="w-full lg:w-[35%] bg-white border border-slate-200 rounded-2xl p-2 flex flex-col shadow-xs min-h-[300px] lg:min-h-auto">
            <div id="mapContainer" class="flex-1 w-full rounded-xl bg-slate-50 border border-slate-200 min-h-[300px] lg:min-h-[330px] z-10"></div>
        </div>
    </section>

    <script>
        const csvUrl = 'https://raw.githubusercontent.com/sigmaperu/DashBoards/refs/heads/main/BD_DBE_Julio_2026.csv';
        let rawData = [];
        let filteredData = [];
        let selectedDia = 'ALL';
        const dbeMeta = 2.15;

        // Estados de Filtros de Selección Múltiple con CTRL
        let selectedCentrosFiltro = [];
        let selectedCanalesFiltro = []; 
        let selectedVehiculosFiltro = [];
        let selectedRutasFiltro = [];
        let selectedDistritosFiltro = [];
        let selectedMotivosFiltro = [];

        let trendChart = null;
        let mapInstance = null;
        let markersGroup = null;

        let expandedState = {
            'card-Global': false, 'card-Chancay': false, 'card-Ate1': false, 'card-Ate2': false,
            'subcard-motivo': false, 'subcard-vehiculo': false, 'subcard-ruta': false, 'subcard-distrito': false,
            'master-table': false
        };

        const centroMapping = { "0374": "Ate 1", "0752": "Chorrillos", "0754": "Chancay", "0780": "Ate 2" };

        document.addEventListener('DOMContentLoaded', () => { buildCalendarGrid(); initMap(); loadData(); });

        function initMap() {
            mapInstance = L.map('mapContainer', { zoomControl: false }).setView([-12.0463, -77.0427], 11);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; CARTO' }).addTo(mapInstance);
            markersGroup = L.layerGroup().addTo(mapInstance);
        }

        function buildCalendarGrid() {
            const grid = document.getElementById('calendarGrid'); grid.innerHTML = '';
            const diaInicioSemana = 3; const totalDiasMes = 31;
            for (let s = 0; s < diaInicioSemana; s++) grid.appendChild(document.createElement('div'));
            for (let d = 1; d <= totalDiasMes; d++) {
                const diaStr = String(d).padStart(2, '0');
                const btn = document.createElement('button');
                btn.className = "day-btn text-[9px] py-1 border border-slate-200 rounded-md bg-slate-50 text-slate-600 hover:bg-slate-100 transition-all text-center cursor-pointer font-medium";
                btn.id = `btn-day-${diaStr}`; btn.innerText = d;
                btn.onclick = () => selectDiaCalendario(diaStr);
                grid.appendChild(btn);
            }
        }

        async function loadData() {
            try {
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error('Error GitHub');
                const text = await response.text();
                parseCSV(text);
                applyFilters();
            } catch (err) {
                generateMockData();
                applyFilters();
            }
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/); rawData = [];
            for (let i = 1; i < lines.length; i++) {
                let line = lines[i].trim(); if (!line) continue;
                let cols = []; let insideQuote = false; let current = "";
                for (let j = 0; j < line.length; j++) {
                    let char = line[j];
                    if (char === '"') insideQuote = !insideQuote;
                    else if (char === ',' && !insideQuote) { cols.push(current.trim()); current = ""; }
                    else current += char;
                }
                cols.push(current.trim());
                if (cols.length < 37) continue;

                let rawCentro = cols[1] || ''; if (!rawCentro || rawCentro === "null") continue;
                let centroNombre = centroMapping[rawCentro] || rawCentro;
                let fechaStr = cols[9] || '01/07/2026';
                let diaFicticio = '01'; if (fechaStr.includes('/')) diaFicticio = fechaStr.split('/')[1].trim().padStart(2, '0');
                let canalNombre = cols[2] || 'OTROS';
                let motivoRechazo = cols[36] || 'SIN ESPECIFICAR';
                if(motivoRechazo === '-' || !motivoRechazo) motivoRechazo = 'SIN ESPECIFICAR';
                motivoRechazo = motivoRechazo.toUpperCase();

                rawData.push({
                    centro: centroNombre, canal: canalNombre,
                    codClie: cols[5] || '000000', cliente: cols[6] || 'CLIENTE OPERATIVO',
                    vehiculo: cols[4] || 'No Especificado', rutaVenta: cols[7] || 'Sin Ruta',
                    distrito: (cols[15] || 'OTROS').toUpperCase(), motivo: motivoRechazo,
                    lat: parseFloat(cols[16]) || 0, lng: parseFloat(cols[17]) || 0, fecha: fechaStr, numDia: diaFicticio,
                    surtido: parseFloat(cols[31]) || 0, rechazado: parseFloat(cols[34]) || 0
                });
            }
        }

        function generateMockData() {
            const centros = ['Ate 1', 'Chancay', 'Ate 2'];
            const canales = ['FSE', 'MOD', 'DET', 'OTROS'];
            const vehicles = ['C2I-891', 'BNY-776', 'AKL-733'];
            const distritos = ['ATE', 'COMAS', 'SAN BORJA', 'CHORRILLOS'];
            const motivos = ['RECEPCIÓN NO RECIBE', 'TIENDA CERRADA', 'FUERA HORA DE RECEPC'];
            for (let day = 1; day <= 31; day++) {
                let formattedDay = String(day).padStart(2, '0');
                for (let k = 0; k < 12; k++) {
                    let surtido = Math.floor(Math.random() * 2000) + 300;
                    let rechazado = Math.random() > 0.75 ? Math.floor(Math.random() * surtido * 0.05) : 0;
                    rawData.push({
                        centro: centros[Math.floor(Math.random() * centros.length)], centro: centros[Math.floor(Math.random() * centros.length)], canal: canales[Math.floor(Math.random() * canales.length)],
                        codClie: '117' + (5000 + k), cliente: 'DISTRIBUIDORA LIMA S.A.C.',
                        vehiculo: vehicles[Math.floor(Math.random() * vehicles.length)], rutaVenta: 'B6' + String.fromCharCode(65 + Math.floor(Math.random() * 4)),
                        distrito: distritos[Math.floor(Math.random() * distritos.length)], motivo: rechazado > 0 ? motivos[Math.floor(Math.random() * motivos.length)] : 'SIN ESPECIFICAR',
                        lat: -12.0463 + (Math.random() - 0.5) * 0.15, lng: -77.0427 + (Math.random() - 0.5) * 0.15,
                        fecha: `${formattedDay}/07/2026`, numDia: formattedDay, surtido: surtido, rechazado: rechazado
                    });
                }
            }
        }

        function selectDiaCalendario(dia) {
            selectedDia = dia;
            document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
            const btnAll = document.getElementById('btnDayAll');
            if (dia === 'ALL') { btnAll.classList.add('bg-indigo-600', 'text-white'); } 
            else { btnAll.classList.remove('bg-indigo-600', 'text-white'); const targetBtn = document.getElementById(`btn-day-${dia}`); if (targetBtn) targetBtn.classList.add('active'); }
            applyFilters();
        }

        // CONTROL CLIC MÁSTER TARJETAS FILA 1
        window.handleCardClick = function(centroName, event) {
            if(event.target.closest('.noclick')) return;
            if (centroName === 'Total Operación') { selectedCentrosFiltro = []; } else {
                if (event.ctrlKey) {
                    if (selectedCentrosFiltro.includes(centroName)) selectedCentrosFiltro = selectedCentrosFiltro.filter(x => x !== centroName);
                    else selectedCentrosFiltro.push(centroName);
                } else {
                    if (selectedCentrosFiltro.length === 1 && selectedCentrosFiltro[0] === centroName) selectedCentrosFiltro = [];
                    else selectedCentrosFiltro = [centroName];
                }
            }
            applyFilters();
        };

        window.handleCanalCircleClick = function(canalName, event) {
            event.stopPropagation();
            if (event.ctrlKey) {
                if (selectedCanalesFiltro.includes(canalName)) selectedCanalesFiltro = selectedCanalesFiltro.filter(x => x !== canalName);
                else selectedCanalesFiltro.push(canalName);
            } else {
                if (selectedCanalesFiltro.length === 1 && selectedCanalesFiltro[0] === canalName) selectedCanalesFiltro = [];
                else selectedCanalesFiltro = [canalName];
            }
            applyFilters();
        };

        // FILTRADO AVANZADO INTERACTIVO FILA 3
        window.handleDimensionItemClick = function(dimensionKey, value, event) {
            let targetArray;
            if (dimensionKey === 'motivo') targetArray = selectedMotivosFiltro;
            else if (dimensionKey === 'vehiculo') targetArray = selectedVehiculosFiltro;
            else if (dimensionKey === 'rutaVenta') targetArray = selectedRutasFiltro;
            else if (dimensionKey === 'distrito') targetArray = selectedDistritosFiltro;

            if (event.ctrlKey) {
                if (targetArray.includes(value)) targetArray.splice(targetArray.indexOf(value), 1);
                else targetArray.push(value);
            } else {
                if (targetArray.length === 1 && targetArray[0] === value) targetArray.length = 0;
                else { targetArray.length = 0; targetArray.push(value); }
            }
            applyFilters();
        };

        // FUNCIONES DE DESPLIEGUE ARREGLADAS (Evitan la pérdida de eventos de escucha)
        window.toggleCanales = function(containerId, event) {
            if(event) event.stopPropagation();
            expandedState[containerId] = !expandedState[containerId];
            applyFilters();
        };

        window.toggleSubcard = function(id) {
            expandedState[id] = !expandedState[id];
            applyFilters();
        };

        window.toggleTableExpansion = function() {
            expandedState['master-table'] = !expandedState['master-table'];
            applyFilters();
        };

        window.shareDashboard = function() {
            if (navigator.share) {
                navigator.share({
                    title: 'Dashboard de Control % DBE - Sigma Foods',
                    text: 'Reporte operativo de control de rechazos en despacho.',
                    url: 'https://sigmaperu.github.io/DashBoards/daily/dbe/2026/julio.html'
                }).catch(err => console.log("Compartición no admitida."));
            } else {
                window.print();
            }
        };

        function applyFilters() {
            let dataTemporal = rawData.filter(row => {
                if (selectedDia !== 'ALL' && row.numDia !== selectedDia) return false;
                return true;
            });

            renderPerformanceCards(dataTemporal);

            let dataFila1 = dataTemporal.filter(row => {
                if (selectedCentrosFiltro.length > 0 && !selectedCentrosFiltro.includes(row.centro)) return false;
                if (selectedCanalesFiltro.length > 0 && !selectedCanalesFiltro.includes(row.canal)) return false;
                return true;
            });

            renderMotivosSubcard('subcard-motivo', 'Motivo', dataFila1);
            renderDimensionSubcard('subcard-vehiculo', 'Vehículo Placa', dataFila1, 'vehiculo', selectedVehiculosFiltro);
            renderDimensionSubcard('subcard-ruta', 'Ruta Venta', dataFila1, 'rutaVenta', selectedRutasFiltro);
            renderDimensionSubcard('subcard-distrito', 'Distrito', dataFila1, 'distrito', selectedDistritosFiltro);

            filteredData = dataFila1.filter(row => {
                if (selectedMotivosFiltro.length > 0 && !selectedMotivosFiltro.includes(row.motivo)) return false;
                if (selectedVehiculosFiltro.length > 0 && !selectedVehiculosFiltro.includes(row.vehiculo)) return false;
                if (selectedRutasFiltro.length > 0 && !selectedRutasFiltro.includes(row.rutaVenta)) return false;
                if (selectedDistritosFiltro.length > 0 && !selectedDistritosFiltro.includes(row.distrito)) return false;
                return true;
            });

            renderMasterTable(filteredData);
            renderMapMarkers(filteredData);

            // CORRECCIÓN CLAVE: El gráfico responde dinámicamente tanto a la Fila 1 como a las selecciones de la Fila 3
            let dataParaGraficoTrend = rawData.filter(row => {
                if (selectedCentrosFiltro.length > 0 && !selectedCentrosFiltro.includes(row.centro)) return false;
                if (selectedCanalesFiltro.length > 0 && !selectedCanalesFiltro.includes(row.canal)) return false;
                if (selectedMotivosFiltro.length > 0 && !selectedMotivosFiltro.includes(row.motivo)) return false;
                if (selectedVehiculosFiltro.length > 0 && !selectedVehiculosFiltro.includes(row.vehiculo)) return false;
                if (selectedRutasFiltro.length > 0 && !selectedRutasFiltro.includes(row.rutaVenta)) return false;
                if (selectedDistritosFiltro.length > 0 && !selectedDistritosFiltro.includes(row.distrito)) return false;
                return true;
            });

            setTimeout(() => { renderTrendChart(dataParaGraficoTrend); }, 60);
            setTimeout(() => { lucide.createIcons(); }, 100);
        }

        function renderPerformanceCards(dataCards) {
            const updateClasses = (id, target) => {
                const el = document.getElementById(id);
                if (selectedCentrosFiltro.length > 0 && !selectedCentrosFiltro.includes(target) && target !== 'Total') el.classList.add('card-inactive');
                else el.classList.remove('card-inactive');
            };
            updateClasses('card-Global', 'Total'); updateClasses('card-Chancay', 'Chancay'); updateClasses('card-Ate1', 'Ate 1'); updateClasses('card-Ate2', 'Ate 2');

            buildSingleCard('card-Global', 'Total Operación', dataCards, true, 'Total');
            buildSingleCard('card-Chancay', 'Chancay', dataCards.filter(x => x.centro === 'Chancay'), false, 'Chancay');
            buildSingleCard('card-Ate1', 'Ate 1', dataCards.filter(x => x.centro === 'Ate 1'), false, 'Ate 1');
            buildSingleCard('card-Ate2', 'Ate 2', dataCards.filter(x => x.centro === 'Ate 2'), false, 'Ate 2');
        }

        function buildSingleCard(containerId, titleName, dataset, isGlobalCard, filterKey) {
            let totalSurtido = 0; let totalRechazado = 0; let canalMap = {};
            dataset.forEach(row => { if (!canalMap[row.canal]) canalMap[row.canal] = { s: 0, r: 0 }; });
            dataset.forEach(row => {
                canalMap[row.canal].s += row.surtido; canalMap[row.canal].r += row.rechazado;
                if (expandedState[containerId] && selectedCanalesFiltro.length > 0) {
                    if (selectedCanalesFiltro.includes(row.canal)) { totalSurtido += row.surtido; totalRechazado += row.rechazado; }
                } else { totalSurtido += row.surtido; totalRechazado += row.rechazado; }
            });

            let dbeRate = totalSurtido > 0 ? (totalRechazado / totalSurtido * 100) : 0;
            let fillPercent = Math.min((dbeRate / dbeMeta) * 100, 100);
            let barColor = dbeRate > dbeMeta ? 'bg-rose-500' : 'bg-emerald-500';
            let textColor = dbeRate > dbeMeta ? 'text-rose-600' : 'text-emerald-600';
            let isExpanded = expandedState[containerId];

            let circleHtml = (selectedCentrosFiltro.length === 0 && filterKey === 'Total') || selectedCentrosFiltro.includes(filterKey)
                ? `<div class="w-3.5 h-3.5 rounded-full bg-indigo-600 border border-indigo-500 flex items-center justify-center text-[8px] text-white font-bold shrink-0 shadow-sm">✓</div>`
                : `<div class="w-3.5 h-3.5 rounded-full border border-slate-300 bg-slate-100 shrink-0"></div>`;

            let cardHtml = `
                <div class="flex flex-col justify-between h-full font-mono text-slate-800">
                    <div onclick="handleCardClick('${titleName}', event)">
                        <div class="flex items-center justify-between gap-1">
                            <div class="flex items-center gap-1.5 truncate">
                                ${circleHtml}
                                <h4 class="text-[9px] font-black ${isGlobalCard ? 'text-indigo-600' : 'text-slate-700'} uppercase tracking-wider truncate">${titleName}</h4>
                            </div>
                            <span class="text-[7.5px] px-1 py-0.5 rounded font-bold shrink-0 ${dbeRate > dbeMeta ? 'bg-rose-100 text-rose-700 border border-rose-200' : 'bg-emerald-100 text-emerald-700 border border-emerald-200'}">
                                ${dbeRate > dbeMeta ? 'Desviado' : 'En Meta'}
                            </span>
                        </div>
                        <div class="mt-2.5">
                            <h2 class="text-xl font-black ${dbeRate > dbeMeta ? 'text-rose-600' : 'text-emerald-600'} tracking-tight">${totalRechazado.toFixed(1).toLocaleString('es-PE')}</h2>
                            <p class="text-[9px] uppercase font-bold text-slate-400 tracking-wide mt-0.5">Kg. Rechazados</p>
                        </div>
                        <div class="flex items-center justify-between mt-2.5 text-[10px] text-slate-500 border-t border-slate-200 pt-1.5">
                            <span>Kg. Surtidos:</span>
                            <span class="font-mono text-slate-800 font-semibold">${totalSurtido.toFixed(1).toLocaleString('es-PE')}</span>
                        </div>
                        <div class="mt-2.5">
                            <div class="flex justify-between text-[9px] font-bold uppercase tracking-wider text-slate-500 mb-1">
                                <span>% DBE: <b class="${textColor}">${dbeRate.toFixed(2)}%</b></span>
                                <span>Meta: 2.15%</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-1 relative overflow-hidden">
                                <div class="${barColor} h-1 rounded-full transition-all duration-500" style="width: ${fillPercent}%"></div>
                                <div class="absolute left-[71.6%] top-0 w-0.5 h-1 bg-slate-300 z-10"></div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3 border-t border-slate-200 pt-1.5 flex flex-col noclick">
                        <button onclick="toggleCanales('${containerId}', event)" class="w-full flex items-center justify-between text-[9px] font-bold uppercase tracking-wider text-slate-400 hover:text-indigo-600 transition-colors cursor-pointer py-0.5">
                            <span>% DBE por Canal</span>
                            <span class="text-[9px] transition-transform duration-200">${isExpanded ? '▲' : '▼'}</span>
                        </button>
                        <div class="${isExpanded ? 'block' : 'hidden'} mt-2 space-y-1.5">
            `;

            Object.keys(canalMap).sort().forEach(canal => {
                let cItem = canalMap[canal] || {s:0, r:0}; let cRate = cItem.s > 0 ? (cItem.r / cItem.s * 100) : 0;
                let cWidth = Math.min((cRate / 5) * 100, 100);
                let cColor = cRate > dbeMeta ? 'bg-rose-500' : 'bg-emerald-500';
                let cText = cRate > dbeMeta ? 'text-rose-600' : 'text-emerald-600';
                let canalCircle = selectedCanalesFiltro.includes(canal)
                    ? `<div class="w-2.5 h-2.5 rounded-full bg-indigo-600 border border-indigo-500 flex items-center justify-center text-[6px] text-white font-bold shrink-0">✓</div>`
                    : `<div class="w-2.5 h-2.5 rounded-full border border-slate-300 bg-slate-50 shrink-0"></div>`;

                cardHtml += `
                    <div onclick="handleCanalCircleClick('${canal}', event)" class="flex items-center justify-between gap-1.5 text-[10px] cursor-pointer hover:bg-slate-50 p-0.5 rounded transition-colors noclick">
                        <div class="flex items-center gap-1.5 truncate w-14">
                            ${canalCircle} <span class="font-medium text-slate-600 truncate">${canal}</span>
                        </div>
                        <div class="flex-1 bg-slate-100 h-1 rounded-full relative overflow-hidden">
                            <div class="${cColor} h-1 rounded-full" style="width: ${cWidth}%"></div>
                        </div>
                        <span class="font-bold font-mono text-right w-9 ${cText}">${cRate.toFixed(1)}%</span>
                    </div>
                `;
            });
            cardHtml += `</div></div></div>`;
            document.getElementById(containerId).innerHTML = cardHtml;
        }

        function renderMotivosSubcard(containerId, titleLabel, dataset) {
            let map = {};
            dataset.forEach(row => {
                if (row.rechazado <= 0 || row.motivo === 'SIN ESPECIFICAR') return;
                if (!map[row.motivo]) map[row.motivo] = { name: row.motivo, r: 0 };
                map[row.motivo].r += row.rechazado;
            });

            let list = Object.values(map).sort((a, b) => b.r - a.r);
            let isExpanded = expandedState[containerId];
            let visibleList = isExpanded ? list : list.slice(0, 10);
            let maxRechazo = list.length > 0 ? list[0].r : 1;

            let html = `
                <div class="flex items-center justify-between border-b border-slate-200 pb-1.5 mb-2.5 font-mono">
                    <h4 class="text-[10px] font-black tracking-wider uppercase text-amber-600">${titleLabel} por Impacto</h4>
                </div>
                <div class="space-y-2.5 max-h-[175px] overflow-y-auto custom-scrollbar pr-1 font-mono">
            `;

            visibleList.forEach(item => {
                let fillWidth = Math.min((item.r / maxRechazo) * 100, 100);
                let isActive = selectedMotivosFiltro.includes(item.name);
                html += `
                    <div onclick="handleDimensionItemClick('motivo', '${item.name}', event)" class="text-[10px] cursor-pointer p-0.5 rounded hover:bg-slate-50 transition-all ${isActive ? 'subitem-active' : ''}">
                        <div class="flex justify-between items-center mb-0.5">
                            <span class="font-bold text-slate-700 truncate max-w-[155px]" title="${item.name}">${item.name}</span>
                            <span class="font-black font-mono text-amber-600">${item.r.toFixed(1).toLocaleString('es-PE')} Kg</span>
                        </div>
                        <div class="w-full bg-slate-100 h-1 rounded-full overflow-hidden">
                            <div class="bg-amber-500 h-1 rounded-full transition-all" style="width: ${fillWidth}%"></div>
                        </div>
                    </div>
                `;
            });

            html += `</div><button onclick="toggleSubcard('${containerId}')" class="w-full border-t border-slate-200 mt-2 pt-1.5 flex items-center justify-between text-[9px] font-bold uppercase tracking-wider text-slate-400 hover:text-amber-600 cursor-pointer font-mono"><span>${isExpanded ? 'Contraer' : 'Ver Todos'}</span><span>${isExpanded ? '▲' : '▼'}</span></button>`;
            document.getElementById(containerId).innerHTML = html;
        }

        function renderDimensionSubcard(containerId, titleLabel, dataset, groupingKey, filterArray) {
            let map = {};
            dataset.forEach(row => {
                let k = row[groupingKey]; if (!k || k === '-') return;
                if (!map[k]) map[k] = { name: k, s: 0, r: 0 };
                map[k].s += row.surtido; map[k].r += row.rechazado;
            });

            let list = Object.values(map).map(item => {
                item.rate = item.s > 0 ? (item.r / item.s * 100) : 0;
                return item;
            }).sort((a, b) => b.rate - a.rate);

            let maxDbeInTanda = list.length > 0 ? Math.max(...list.map(x => x.rate)) : 1;
            if(maxDbeInTanda === 0) maxDbeInTanda = 1;

            let isExpanded = expandedState[containerId];
            let visibleList = isExpanded ? list : list.slice(0, 10);

            let subhtml = `
                <div class="flex items-center justify-between border-b border-slate-200 pb-1.5 mb-2.5 font-mono">
                    <h4 class="text-[10px] font-black tracking-wider uppercase text-indigo-400">${titleLabel} Críticos</h4>
                </div>
                <div class="space-y-2.5 max-h-[175px] overflow-y-auto custom-scrollbar pr-1 font-mono">
            `;

            visibleList.forEach(item => {
                let colBar = item.rate > dbeMeta ? 'bg-rose-500' : 'bg-emerald-500';
                let colText = item.rate > dbeMeta ? 'text-rose-600' : 'text-emerald-600';
                let fillW = Math.min((item.rate / maxDbeInTanda) * 100, 100);
                let isActive = filterArray.includes(item.name);

                subhtml += `
                    <div onclick="handleDimensionItemClick('${groupingKey}', '${item.name}', event)" class="text-[10px] cursor-pointer p-0.5 rounded hover:bg-slate-50 transition-all ${isActive ? 'subitem-active' : ''}">
                        <div class="flex justify-between items-center mb-0.5">
                            <span class="font-mono font-bold text-slate-700 truncate max-w-[100px]" title="${item.name}">${item.name}</span>
                            <span class="text-slate-500 font-mono text-[9px]">${item.r.toFixed(1)}/${item.s.toFixed(1)} kg</span>
                            <span class="font-black font-mono ${colText}">${item.rate.toFixed(2)}%</span>
                        </div>
                        <div class="w-full bg-slate-100 h-1 rounded-full overflow-hidden">
                            <div class="${colBar} h-1 rounded-full transition-all" style="width: ${fillW}%"></div>
                        </div>
                    </div>
                `;
            });

            subhtml += `</div><button onclick="toggleSubcard('${containerId}')" class="w-full border-t border-slate-200 mt-2 pt-1.5 flex items-center justify-between text-[9px] font-bold uppercase tracking-wider text-slate-400 hover:text-indigo-600 cursor-pointer font-mono"><span>${isExpanded ? 'Contraer' : 'Ver Todos'}</span><span>${isExpanded ? '▲' : '▼'}</span></button>`;
            document.getElementById(containerId).innerHTML = subhtml;
        }

        function renderMasterTable(dataset) {
            let customerMap = {};
            dataset.forEach(row => {
                if (row.rechazado <= 0) return;
                let key = row.codClie;
                if (!customerMap[key]) {
                    customerMap[key] = {
                        fecha: row.fecha, cod: row.codClie, name: row.cliente,
                        ruta: row.rutaVenta, canal: row.canal, veh: row.vehiculo, mot: row.motivo,
                        surtidoTotal: 0, rechazadoTotal: 0
                    };
                }
                customerMap[key].surtidoTotal += row.surtido;
                customerMap[key].rechazadoTotal += row.rechazado;
            });

            let listWithRechazo = Object.values(customerMap).sort((a, b) => b.rechazadoTotal - a.rechazadoTotal);
            let isExpanded = expandedState['master-table'];
            let visibleList = isExpanded ? listWithRechazo : listWithRechazo.slice(0, 10);

            const tbody = document.getElementById('masterTableBody');
            tbody.innerHTML = '';

            if (visibleList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="p-4 text-center italic text-slate-400 font-mono">Sin incidencias de rechazo registradas en este cuadrante.</td></tr>`;
                return;
            }

            visibleList.forEach(c => {
                let tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors border-b border-slate-100 font-mono text-slate-700";
                tr.innerHTML = `
                    <td class="p-2 font-medium text-indigo-600/90 text-[10.5px]">${c.fecha}</td>
                    <td class="p-2 text-slate-400 text-[10px]">${c.cod}</td>
                    <td class="p-2 font-medium text-slate-800 truncate max-w-[120px]" title="${c.name}">${c.name}</td>
                    <td class="p-2 text-slate-500 font-medium">${c.ruta}</td>
                    <td class="p-2 text-slate-500">${c.canal}</td>
                    <td class="p-2 text-slate-500 text-[10px]">${c.veh}</td>
                    <td class="p-2 truncate max-w-[110px] text-amber-600 font-medium" title="${c.mot}">${c.mot}</td>
                    <td class="p-2 text-right text-slate-400">${c.surtidoTotal.toFixed(1).toLocaleString('es-PE')}</td>
                    <td class="p-2 text-right text-rose-600 font-black">${c.rechazadoTotal.toFixed(1).toLocaleString('es-PE')} Kg</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderMapMarkers(dataset) {
            if (!markersGroup) return;
            markersGroup.clearLayers();

            let validPoints = dataset.filter(x => x.rechazado > 0 && !isNaN(x.lat) && !isNaN(x.lng) && x.lat !== 0 && x.lng !== 0);
            
            validPoints.forEach(p => {
                let rate = p.surtido > 0 ? (p.rechazado / p.surtido * 100) : 0;
                let markerColor = rate > dbeMeta ? '#e11d48' : '#059669';
                let markerRadius = Math.max(5, Math.min(p.rechazado / 8, 14));

                let circleMarker = L.circleMarker([p.lat, p.lng], {
                    radius: markerRadius,
                    fillColor: markerColor,
                    color: '#ffffff',
                    weight: 1.5,
                    opacity: 1,
                    fillOpacity: 0.75
                });

                let popupContent = `
                    <div style="font-family:'Inter',sans-serif; font-size:11px; color:#1e293b; line-height:1.4; width: 170px;">
                        <b style="color:#4f46e5; text-transform:uppercase;">${p.cliente}</b><br/>
                        <b>Fecha:</b> ${p.fecha}<br/>
                        <b>Ruta:</b> ${p.rutaVenta} | <b>Vehículo:</b> ${p.vehiculo}<br/>
                        <b>Rechazado:</b> <span style="color:#e11d48;font-weight:bold;">${p.rechazado.toFixed(1)} Kg</span><br/>
                        <b>Motivo:</b> <span style="color:#b45309;font-weight:bold;">${p.motivo}</span>
                    </div>
                `;

                circleMarker.bindPopup(popupContent);
                markersGroup.addLayer(circleMarker);
            });

            if (validPoints.length > 0) {
                let coordsArray = validPoints.map(x => [x.lat, x.lng]);
                mapInstance.fitBounds(coordsArray, { padding: [25, 25], maxZoom: 14 });
            } else {
                mapInstance.setView([-12.0463, -77.0427], 11);
            }
        }

        function renderTrendChart(dataTrend) {
            let fMap = {};
            dataTrend.forEach(r => {
                if(!fMap[r.numDia]) fMap[r.numDia] = {s:0, r:0};
                fMap[r.numDia].s += r.surtido; fMap[r.numDia].r += r.rechazado;
            });
            let sortedDays = Object.keys(fMap).sort((a,b) => parseInt(a) - parseInt(b));
            if(trendChart) trendChart.destroy();
            
            const ctx = document.getElementById('chartTrend').getContext('2d');
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: sortedDays,
                    datasets: [
                        {
                            label: '% DBE Diario',
                            data: sortedDays.map(d => fMap[d].s > 0 ? (fMap[d].r / fMap[d].s * 100).toFixed(2) : 0),
                            borderColor: '#4f46e5',
                            backgroundColor: 'transparent',
                            borderWidth: 2.5,
                            tension: 0.1,
                            pointRadius: 2.5,
                            yAxisID: 'y'
                        },
                        {
                            label: 'Kg. Rechazados',
                            data: sortedDays.map(d => fMap[d].r.toFixed(1)),
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245, 158, 11, 0.03)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.1,
                            pointRadius: 2,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'top', labels: { boxWidth: 12, font: { size: 10, family: 'monospace' } } } },
                    scales: { 
                        y: { type: 'linear', position: 'left', beginAtZero: true, ticks: { color: '#4f46e5', callback: v => v + '%' }, grid: { color: '#e2e8f0' } },
                        y1: { type: 'linear', position: 'right', beginAtZero: true, ticks: { color: '#b45309', callback: v => v + ' kg' }, grid: { drawOnChartArea: false } },
                        x: { ticks: { color: '#64748b' }, grid: { display: false } }
                    }
                }
            });
        }

        window.downloadExcelComas = function() {
            let aggregatedExcelMap = {};
            filteredData.forEach(row => {
                if (row.rechazado <= 0) return;
                let k = row.codClie;
                if (!aggregatedExcelMap[k]) {
                    aggregatedExcelMap[k] = { ...row, surtido: 0, rechazado: 0 };
                }
                aggregatedExcelMap[k].surtido += row.surtido;
                aggregatedExcelMap[k].rechazado += row.rechazado;
            });

            let recordsMap = Object.values(aggregatedExcelMap).sort((a, b) => b.rechazado - a.rechazado);

            let csvContent = "\uFEFF"; 
            csvContent += "Fecha,Código,Cliente,Ruta,Canal,Vehículo,Motivo,Surtido (Kg),Rechazado (Kg),% DBE\n";
            
            recordsMap.forEach(c => {
                let dbe = c.surtido > 0 ? (c.rechazado / c.surtido * 100).toFixed(1) : "0.0";
                let nameClean = c.cliente.replace(/,/g, " ").replace(/"/g, '""');
                let motClean = c.motivo.replace(/,/g, " ").replace(/"/g, '""');
                csvContent += `"${c.fecha}","${c.codClie}","${nameClean}","${c.rutaVenta}","${c.canal}","${c.vehiculo}","${motClean}",${c.surtido.toFixed(1)},${c.rechazado.toFixed(1)},${dbe}%\n`;
            });

            let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            let url = URL.createObjectURL(blob);
            let link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "Reporte_Maestro_DBE_Sigma.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>
</body>
</html>
