        <div class="w-full lg:w-[35%] bg-white border border-slate-200 rounded-2xl p-2 flex flex-col shadow-xs min-h-[300px] lg:min-h-auto">

    <script>
        const csvUrl = 'https://raw.githubusercontent.com/sigmaperu/DashBoards/refs/heads/main/BD_DBE_Julio_2026.csv.gz';
        const asignacionUrl = 'https://raw.githubusercontent.com/sigmaperu/DashBoards/heads/main/Asignacion%20unidades.csv';
        
        let rawData = []; let filteredData = []; let asignacionMap = {}; let selectedDias = []; const dbeMeta = 2.15;

        let selectedCentrosFiltro = []; let selectedCanalesFiltro = []; let selectedVehiculosFiltro = [];
        let selectedRutasFiltro = []; let selectedDistritosFiltro = []; let selectedMotivosFiltro = [];
        let selectedUnidadesFiltro = []; let selectedNombresDiaFiltro = []; let selectedSemanasFiltro = []; let selectedProveedoresFiltro = [];

        let trendChart = null; let chartAsignacion = null; let chartProveedor = null; let chartDiaSemana = null; let chartNumSemana = null;
        let mapInstance = null; let markersGroup = null;

        let expandedState = {
            'card-Global': false, 'card-Chancay': false, 'card-Ate1': false, 'card-Ate2': false,
            'subcard-motivo': false, 'subcard-vehiculo': false, 'subcard-ruta': false, 'subcard-distrito': false, 'master-table': false
        };

        const centroMapping = { "0374": "Ate 1", "0752": "Chorrillos", "0754": "Chancay", "0780": "Ate 2" };
        const diasNombreArr = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

        // Plugin de etiquetas de porcentaje para gráficos de barra (detecta si es horizontal o vertical para posicionar)
        const percentageLabelsPlugin = {
            id: 'percentageLabels',
            afterDatasetsDraw(chart) {
                const { ctx, data } = chart; ctx.save();
                ctx.font = 'bold 9px "Inter", sans-serif'; ctx.fillStyle = '#475569';
                const isHorizontal = chart.options.indexAxis === 'y';
                
                chart.getDatasetMeta(0).data.forEach((bar, index) => {
                    const value = data.datasets[0].data[index];
                    if (value !== undefined && value !== null) {
                        const txt = Number(value).toFixed(2) + '%';
                        if (isHorizontal) {
                            ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
                            ctx.fillText(txt, bar.x + 4, bar.y);
                        } else {
                            ctx.textBaseline = 'bottom'; ctx.textAlign = 'center';
                            ctx.fillText(txt, bar.x, bar.y - 4);
                        }
                    }
                });
                ctx.restore();
            }
        };

        const trendLabelsPlugin = {
            id: 'trendLabelsPlugin',
            afterDatasetsDraw(chart) {
                const { ctx } = chart; ctx.save();
                const barMeta = chart.getDatasetMeta(1);
                if (barMeta && !barMeta.hidden) {
                    ctx.font = 'bold 9px "Courier New", monospace'; ctx.fillStyle = '#78350f';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    barMeta.data.forEach((bar, idx) => {
                        const val = chart.data.datasets[1].data[idx];
                        if (val && val > 0) {
                            ctx.save(); ctx.translate(bar.x, (bar.y + bar.base) / 2); ctx.rotate(-Math.PI / 2);
                            ctx.fillText(Math.round(val), 0, 0); ctx.restore();
                        }
                    });
                }
                const lineMeta = chart.getDatasetMeta(0);
                if (lineMeta && !lineMeta.hidden) {
                    ctx.font = 'black 9px "Inter", sans-serif'; ctx.fillStyle = '#4f46e5';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
                    lineMeta.data.forEach((pt, idx) => {
                        const val = chart.data.datasets[0].data[idx];
                        if (val !== undefined && val !== null) ctx.fillText(Number(val).toFixed(1) + '%', pt.x, pt.y - 5);
                    });
                }
                ctx.restore();
            }
        };

        // Configuración de escalas limpias (detecta si es horizontal para invertir los ejes limpios)
        function getScalesConfig(isHorizontal = false) {
            return {
                y: { grid: { display: false }, ticks: { display: !isHorizontal, font: { size: 9, weight: 'bold' } }, border: { display: false } },
                x: { grid: { display: false }, ticks: { display: isHorizontal, font: { size: 9, weight: 'bold' } }, border: { display: false } }
            };
        }

        const cleanScalesConfig = {
            y: { grid: { display: false }, ticks: { display: false }, border: { display: false } },
            x: { grid: { display: false }, ticks: { font: { size: 9, weight: 'bold' } } }
        };

        document.addEventListener('DOMContentLoaded', () => { buildCalendarGrid(); initMap(); loadData(); lucide.createIcons(); });

        function initMap() {
            mapInstance = L.map('mapContainer', { zoomControl: false }).setView([-12.0463, -77.0427], 11);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; CARTO' }).addTo(mapInstance);
            markersGroup = L.layerGroup().addTo(mapInstance);
        }

        function buildCalendarGrid() {
            const grid = document.getElementById('calendarGrid'); grid.innerHTML = '';
            const diaInicioSemana = 3; const totalDiasMes = 31;
            for (let s = 0; s < diaInicioSemana; s++) grid.appendChild(document.createElement('div'));
            for (let d = 1; d <= totalDiasMes; d++) {
                const diaStr = String(d).padStart(2, '0');
                const btn = document.createElement('button');
                btn.className = "day-btn text-[9px] py-1 border border-slate-200 rounded-md bg-slate-50 text-slate-600 hover:bg-slate-100 transition-all text-center cursor-pointer font-medium font-mono";
                btn.id = `btn-day-${diaStr}`; btn.innerText = d;
                btn.onclick = (e) => selectDiaCalendario(diaStr, e);
                grid.appendChild(btn);
            }
        }

        async function loadData() {
            try {
                const resAsig = await fetch(asignacionUrl);
                if (resAsig.ok) { const textAsig = await resAsig.text(); parseAsignacion(textAsig); }
                
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error('Error GitHub');
                
                const arrayBuffer = await response.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);
                const decompressedData = pako.ungzip(uint8Array, { to: 'string' });
                
                parseCSV(decompressedData);
                applyFilters();
            } catch (err) {
                generateMockData();
                applyFilters();
            }
        }

        function parseAsignacion(text) {
            const lines = text.split(/\r?\n/); asignacionMap = {};
            for (let i = 1; i < lines.length; i++) {
                let line = lines[i].trim(); if (!line) continue;
                let parts = line.split(',');
                if (parts.length >= 3) {
                    let placa = parts[0].trim().toUpperCase().replace(/"/g, '');
                    let proveedor = parts[1].trim().toUpperCase().replace(/"/g, ''); // 2da columna: Proveedor
                    let tipoUnidad = parts[2].trim().toUpperCase().replace(/"/g, ''); // 3era columna: Tipo
                    if(placa) {
                        asignacionMap[placa] = {
                            tipo: (tipoUnidad === 'PROPIO' || tipoUnidad === '3PL') ? tipoUnidad : 'HÍBRIDO',
                            prov: proveedor || 'BRAEDT S.A.'
                        };
                    }
                }
            }
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/); rawData = [];
            for (let i = 1; i < lines.length; i++) {
                let line = lines[i].trim(); if (!line) continue;
                let cols = []; let insideQuote = false; let current = "";
                for (let j = 0; j < line.length; j++) {
                    let char = line[j];
                    if (char === '"') insideQuote = !insideQuote;
                    else if (char === ',' && !insideQuote) { cols.push(current.trim()); current = ""; }
                    else current += char;
                }
                cols.push(current.trim()); if (cols.length < 37) continue;

                let rawCentro = cols[1] || ''; if (!rawCentro || rawCentro === "null") continue;
                let centroNombre = centroMapping[rawCentro] || rawCentro;
                let fechaStr = cols[9] || '7/1/2026';
                
                let partesFecha = fechaStr.split('/');
                let mes = parseInt(partesFecha[0]) - 1; let dia = parseInt(partesFecha[1]); let anio = parseInt(partesFecha[2]);
                let diaFicticio = String(dia).padStart(2, '0');
                let dateObj = new Date(anio, mes, dia);
                let nombreDia = diasNombreArr[dateObj.getDay()];
                
                let tempStartYear = new Date(dateObj.getFullYear(), 0, 1);
                let diffInDays = Math.floor((dateObj - tempStartYear) / (24 * 60 * 60 * 1000));
                let numSemReal = Math.ceil((diffInDays + tempStartYear.getDay() + 1) / 7);
                let numeroSemana = "Sem " + String(numSemReal).padStart(2, '0');

                let placaVehiculo = (cols[4] || 'No Especificado').trim().toUpperCase();
                
                // SALVEDAD DE MATCH: Si no existe en el mapa de asignaciones, se inyectan las marcas por defecto (Híbrido y Braedt S.A.)
                let matchObj = asignacionMap[placaVehiculo] || { tipo: 'HÍBRIDO', prov: 'BRAEDT S.A.' };

                rawData.push({
                    centro: centroNombre, canal: cols[2] || 'OTROS',
                    codClie: cols[5] || '000000', cliente: cols[6] || 'CLIENTE OPERATIVO',
                    vehiculo: placaVehiculo, tipoUnidad: matchObj.tipo, proveedor: matchObj.prov,
                    rutaVenta: cols[7] || 'Sin Ruta', distrito: (cols[15] || 'OTROS').toUpperCase(),
                    motivo: (cols[36] || 'SIN ESPECIFICAR').toUpperCase(),
                    nombreDia: nombreDia, numSemana: numeroSemana,
                    lat: parseFloat(cols[16]) || 0, lng: parseFloat(cols[17]) || 0, fecha: fechaStr, numDia: diaFicticio,
                    surtido: parseFloat(cols[31]) || 0, rechazado: parseFloat(cols[34]) || 0
                });
            }
        }

        function generateMockData() {
            const centros = ['Ate 1', 'Chancay', 'Ate 2'];
            for (let d = 1; d <= 31; d++) {
                let formattedDay = String(d).padStart(2, '0');
                let dateObj = new Date(2026, 6, d);
                rawData.push({
                    centro: centros[d % 3], canal: 'DET', codClie: '100'+d, cliente: 'DISTRIBUIDORA DE ALIMENTOS PERÚ S.A.C.',
                    vehiculo: 'ABC-123', tipoUnidad: 'PROPIO', proveedor: 'SIGMA', rutaVenta: 'B6A', distrito: 'ATE', motivo: 'TIENDA CERRADA',
                    nombreDia: diasNombreArr[dateObj.getDay()], numSemana: 'Sem 27', lat: -12.04, lng: -77.04, fecha: `7/${d}/2026`, numDia: formattedDay, surtido: 1500, rechazado: 12
                });
            }
        }

        function selectDiaCalendario(dia, event) {
            if (dia === 'ALL') {
                selectedDias = [];
            } else {
                if (event && event.ctrlKey) {
                    if (selectedDias.includes(dia)) selectedDias = selectedDias.filter(d => d !== dia);
                    else selectedDias.push(dia);
                } else { selectedDias = selectedDias.includes(dia) && selectedDias.length === 1 ? [] : [dia]; }
            }
            applyFilters();
        }

        window.handleCardClick = function(centroKey, event) {
            if (event.target.closest('.noclick')) return;
            if (event.ctrlKey) {
                if (selectedCentrosFiltro.includes(centroKey)) selectedCentrosFiltro = selectedCentrosFiltro.filter(x => x !== centroKey);
                else selectedCentrosFiltro.push(centroKey);
            } else { selectedCentrosFiltro = selectedCentrosFiltro.includes(centroKey) && selectedCentrosFiltro.length === 1 ? [] : [centroKey]; }
            applyFilters();
        };

        window.handleCanalCircleClick = function(canal, event) {
            event.stopPropagation();
            if (event.ctrlKey) {
                if (selectedCanalesFiltro.includes(canal)) selectedCanalesFiltro = selectedCanalesFiltro.filter(x => x !== canal);
                else selectedCanalesFiltro.push(canal);
            } else { selectedCanalesFiltro = selectedCanalesFiltro.includes(canal) && selectedCanalesFiltro.length === 1 ? [] : [canal]; }
            applyFilters();
        };

        window.handleDimensionItemClick = function(key, val, event) {
            let targetArr = key === 'motivo' ? selectedMotivosFiltro : key === 'vehiculo' ? selectedVehiculosFiltro : key === 'rutaVenta' ? selectedRutasFiltro : selectedDistritosFiltro;
            if (event.ctrlKey) {
                if (targetArr.includes(val)) {
                    if (key === 'motivo') selectedMotivosFiltro = selectedMotivosFiltro.filter(x => x !== val);
                    if (key === 'vehiculo') selectedVehiculosFiltro = selectedVehiculosFiltro.filter(x => x !== val);
                    if (key === 'rutaVenta') selectedRutasFiltro = selectedRutasFiltro.filter(x => x !== val);
                    if (key === 'distrito') selectedDistritosFiltro = selectedDistritosFiltro.filter(x => x !== val);
                } else { targetArr.push(val); }
            } else {
                let resets = targetArr.includes(val) && targetArr.length === 1;
                if (key === 'motivo') selectedMotivosFiltro = resets ? [] : [val];
                if (key === 'vehiculo') selectedVehiculosFiltro = resets ? [] : [val];
                if (key === 'rutaVenta') selectedRutasFiltro = resets ? [] : [val];
                if (key === 'distrito') selectedDistritosFiltro = resets ? [] : [val];
            }
            applyFilters();
        };

        window.toggleCanales = function(containerId, e) { e.stopPropagation(); expandedState[containerId] = !expandedState[containerId]; applyFilters(); };
        window.toggleSubcard = function(id) { expandedState[id] = !expandedState[id]; applyFilters(); };
        window.toggleTableExpansion = function() { expandedState['master-table'] = !expandedState['master-table']; applyFilters(); };

        function applyFilters() {
            if (selectedSemanasFiltro.length > 0) {
                let diasDeSemanas = rawData
                    .filter(row => selectedSemanasFiltro.includes(row.numSemana))
                    .map(row => row.numDia);
                selectedDias = [...new Set([...selectedDias, ...diasDeSemanas])];
            }

            document.querySelectorAll('.day-btn').forEach(b => {
                let dId = b.id.replace('btn-day-', '');
                if (selectedDias.includes(dId)) b.classList.add('active');
                else b.classList.remove('active');
            });

            let btnAll = document.getElementById('btnDayAll');
            if (selectedDias.length === 0) btnAll.classList.add('bg-indigo-600', 'text-white');
            else btnAll.classList.remove('bg-indigo-600', 'text-white');

            filteredData = rawData.filter(row => {
                if (selectedDias.length > 0 && !selectedDias.includes(row.numDia)) return false;
                if (selectedCentrosFiltro.length > 0 && !selectedCentrosFiltro.includes(row.centro)) return false;
                if (selectedCanalesFiltro.length > 0 && !selectedCanalesFiltro.includes(row.canal)) return false;
                if (selectedUnidadesFiltro.length > 0 && !selectedUnidadesFiltro.includes(row.tipoUnidad)) return false;
                if (selectedProveedoresFiltro.length > 0 && !selectedProveedoresFiltro.includes(row.proveedor)) return false;
                if (selectedNombresDiaFiltro.length > 0 && !selectedNombresDiaFiltro.includes(row.nombreDia)) return false;
                if (selectedSemanasFiltro.length > 0 && !selectedSemanasFiltro.includes(row.numSemana)) return false;
                if (selectedMotivosFiltro.length > 0 && !selectedMotivosFiltro.includes(row.motivo)) return false;
                if (selectedVehiculosFiltro.length > 0 && !selectedVehiculosFiltro.includes(row.vehiculo)) return false;
                if (selectedRutasFiltro.length > 0 && !selectedRutasFiltro.includes(row.rutaVenta)) return false;
                if (selectedDistritosFiltro.length > 0 && !selectedDistritosFiltro.includes(row.distrito)) return false;
                return true;
            });

            let dataEstructuralMensual = rawData.filter(row => {
                if (selectedCentrosFiltro.length > 0 && !selectedCentrosFiltro.includes(row.centro)) return false;
                if (selectedCanalesFiltro.length > 0 && !selectedCanalesFiltro.includes(row.canal)) return false;
                if (selectedMotivosFiltro.length > 0 && !selectedMotivosFiltro.includes(row.motivo)) return false;
                if (selectedVehiculosFiltro.length > 0 && !selectedVehiculosFiltro.includes(row.vehiculo)) return false;
                if (selectedRutasFiltro.length > 0 && !selectedRutasFiltro.includes(row.rutaVenta)) return false;
                if (selectedDistritosFiltro.length > 0 && !selectedDistritosFiltro.includes(row.distrito)) return false;
                return true;
            });

            renderFilaGraficosBarras(dataEstructuralMensual);
            renderPerformanceCards(filteredData);

            renderMotivosSubcard('subcard-motivo', 'Motivo', filteredData);
            renderDimensionSubcard('subcard-vehiculo', 'Vehículo Placa', filteredData, 'vehiculo', selectedVehiculosFiltro);
            renderDimensionSubcard('subcard-ruta', 'Ruta Venta', filteredData, 'rutaVenta', selectedRutasFiltro);
            renderDimensionSubcard('subcard-distrito', 'Distrito', filteredData, 'distrito', selectedDistritosFiltro);

            renderMasterTable(filteredData); 
            renderMapMarkers(filteredData);

            let dataEvolutivoTrend = dataEstructuralMensual.filter(row => {
                if (selectedUnidadesFiltro.length > 0 && !selectedUnidadesFiltro.includes(row.tipoUnidad)) return false;
                if (selectedProveedoresFiltro.length > 0 && !selectedProveedoresFiltro.includes(row.proveedor)) return false;
                if (selectedNombresDiaFiltro.length > 0 && !selectedNombresDiaFiltro.includes(row.nombreDia)) return false;
                if (selectedSemanasFiltro.length > 0 && !selectedSemanasFiltro.includes(row.numSemana)) return false;
                return true;
            });
            setTimeout(() => { renderTrendChart(dataEvolutivoTrend); }, 55);
        }

        function renderFilaGraficosBarras(datasetMensualBase) {
            let asigMap = {}, provMap = {}, diaMap = {}, semMap = {};
            
            datasetMensualBase.forEach(row => {
                let passAsig = (selectedNombresDiaFiltro.length === 0 || selectedNombresDiaFiltro.includes(row.nombreDia)) && (selectedSemanasFiltro.length === 0 || selectedSemanasFiltro.includes(row.numSemana)) && (selectedProveedoresFiltro.length === 0 || selectedProveedoresFiltro.includes(row.proveedor));
                let passProv = (selectedNombresDiaFiltro.length === 0 || selectedNombresDiaFiltro.includes(row.nombreDia)) && (selectedSemanasFiltro.length === 0 || selectedSemanasFiltro.includes(row.numSemana)) && (selectedUnidadesFiltro.length === 0 || selectedUnidadesFiltro.includes(row.tipoUnidad));
                let passDia = (selectedUnidadesFiltro.length === 0 || selectedUnidadesFiltro.includes(row.tipoUnidad)) && (selectedSemanasFiltro.length === 0 || selectedSemanasFiltro.includes(row.numSemana)) && (selectedProveedoresFiltro.length === 0 || selectedProveedoresFiltro.includes(row.proveedor));
                let passSem = (selectedUnidadesFiltro.length === 0 || selectedUnidadesFiltro.includes(row.tipoUnidad)) && (selectedNombresDiaFiltro.length === 0 || selectedNombresDiaFiltro.includes(row.nombreDia)) && (selectedProveedoresFiltro.length === 0 || selectedProveedoresFiltro.includes(row.proveedor));

                if (passAsig) {
                    if (selectedDias.length === 0 || selectedDias.includes(row.numDia)) {
                        if (!asigMap[row.tipoUnidad]) asigMap[row.tipoUnidad] = { s:0, r:0 };
                        asigMap[row.tipoUnidad].s += row.surtido; asigMap[row.tipoUnidad].r += row.rechazado;
                    }
                }
                if (passProv) {
                    if (selectedDias.length === 0 || selectedDias.includes(row.numDia)) {
                        if (!provMap[row.proveedor]) provMap[row.proveedor] = { s:0, r:0 };
                        provMap[row.proveedor].s += row.surtido; provMap[row.proveedor].r += row.rechazado;
                    }
                }
                if (passDia) {
                    if (!diaMap[row.nombreDia]) diaMap[row.nombreDia] = { s:0, r:0 };
                    diaMap[row.nombreDia].s += row.surtido; diaMap[row.nombreDia].r += row.rechazado;
                }
                if (passSem) {
                    if (!semMap[row.numSemana]) semMap[row.numSemana] = { s:0, r:0 };
                    semMap[row.numSemana].s += row.surtido; semMap[row.numSemana].r += row.rechazado;
                }
            });

            // 1. Asignación Unidades (BARRAS HORIZONTALES)
            if(chartAsignacion) chartAsignacion.destroy();
            let asigLabels = ['PROPIO', '3PL', 'HÍBRIDO'];
            let asigData = asigLabels.map(l => (asigMap[l] && asigMap[l].s > 0) ? (asigMap[l].r / asigMap[l].s * 100).toFixed(2) : 0);
            chartAsignacion = new Chart(document.getElementById('chartAsignacion').getContext('2d'), {
                type: 'bar', plugins: [percentageLabelsPlugin],
                data: { labels: asigLabels, datasets: [{ data: asigData, backgroundColor: asigLabels.map(l => selectedUnidadesFiltro.includes(l) ? '#4f46e5' : '#818cf8'), borderRadius: 4 }] },
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                    layout: { padding: { right: 35, left: 5 } }, scales: getScalesConfig(true),
                    onClick: (e, elements) => {
                        if (elements.length > 0) {
                            let label = asigLabels[elements[0].index];
                            if (e.native.ctrlKey) {
                                selectedUnidadesFiltro = selectedUnidadesFiltro.includes(label) ? selectedUnidadesFiltro.filter(x => x !== label) : [...selectedUnidadesFiltro, label];
                            } else { selectedUnidadesFiltro = selectedUnidadesFiltro.includes(label) && selectedUnidadesFiltro.length === 1 ? [] : [label]; }
                            applyFilters();
                        }
                    }
                }
            });

            // 2. NUEVO GRÁFICO: Proveedores (BARRAS HORIZONTALES - 2DA COLUMNA CON SALVEDAD BRAEDT)
            if(chartProveedor) chartProveedor.destroy();
            let provLabels = Object.keys(provMap).sort(); if(provLabels.length === 0) provLabels = ['BRAEDT S.A.'];
            let provData = provLabels.map(l => (provMap[l] && provMap[l].s > 0) ? (provMap[l].r / provMap[l].s * 100).toFixed(2) : 0);
            chartProveedor = new Chart(document.getElementById('chartProveedor').getContext('2d'), {
                type: 'bar', plugins: [percentageLabelsPlugin],
                data: { labels: provLabels, datasets: [{ data: provData, backgroundColor: provLabels.map(l => selectedProveedoresFiltro.includes(l) ? '#a855f7' : '#c084fc'), borderRadius: 4 }] },
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                    layout: { padding: { right: 35, left: 5 } }, scales: getScalesConfig(true),
                    onClick: (e, elements) => {
                        if (elements.length > 0) {
                            let label = provLabels[elements[0].index];
                            if (e.native.ctrlKey) {
                                selectedProveedoresFiltro = selectedProveedoresFiltro.includes(label) ? selectedProveedoresFiltro.filter(x => x !== label) : [...selectedProveedoresFiltro, label];
                            } else { selectedProveedoresFiltro = selectedProveedoresFiltro.includes(label) && selectedProveedoresFiltro.length === 1 ? [] : [label]; }
                            applyFilters();
                        }
                    }
                }
            });

            // 3. Día de la Semana (Barras Verticales)
            if(chartDiaSemana) chartDiaSemana.destroy();
            let diaLabels = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
            let diaData = diaLabels.map(l => (diaMap[l] && diaMap[l].s > 0) ? (diaMap[l].r / diaMap[l].s * 100).toFixed(2) : 0);
            chartDiaSemana = new Chart(document.getElementById('chartDiaSemana').getContext('2d'), {
                type: 'bar', plugins: [percentageLabelsPlugin],
                data: { labels: diaLabels, datasets: [{ data: diaData, backgroundColor: diaLabels.map(l => selectedNombresDiaFiltro.includes(l) ? '#ea580c' : '#fb923c'), borderRadius: 4 }] },
                options: { 
                    responsive: true, maintainAspectRatio: false, layout: { padding: { top: 15 } }, plugins: { legend: { display: false } }, scales: cleanScalesConfig,
                    onClick: (e, elements) => {
                        if (elements.length > 0) {
                            let label = diaLabels[elements[0].index];
                            if (e.native.ctrlKey) {
                                selectedNombresDiaFiltro = selectedNombresDiaFiltro.includes(label) ? selectedNombresDiaFiltro.filter(x => x !== label) : [...selectedNombresDiaFiltro, label];
                            } else { selectedNombresDiaFiltro = selectedNombresDiaFiltro.includes(label) && selectedNombresDiaFiltro.length === 1 ? [] : [label]; }
                            applyFilters();
                        }
                    }
                }
            });

            // 4. Número de Semana (Barras Verticales)
            if(chartNumSemana) chartNumSemana.destroy();
            let semLabels = Object.keys(semMap).sort(); if(semLabels.length === 0) semLabels = ['Sem 27', 'Sem 28', 'Sem 29', 'Sem 30'];
            let semData = semLabels.map(l => (semMap[l] && semMap[l].s > 0) ? (semMap[l].r / semMap[l].s * 100).toFixed(2) : 0);
            chartNumSemana = new Chart(document.getElementById('chartNumSemana').getContext('2d'), {
                type: 'bar', plugins: [percentageLabelsPlugin],
                data: { labels: semLabels, datasets: [{ data: semData, backgroundColor: semLabels.map(l => selectedSemanasFiltro.includes(l) ? '#0d9488' : '#2dd4bf'), borderRadius: 4 }] },
                options: { 
                    responsive: true, maintainAspectRatio: false, layout: { padding: { top: 15 } }, plugins: { legend: { display: false } }, scales: cleanScalesConfig,
                    onClick: (e, elements) => {
                        if (elements.length > 0) {
                            let label = semLabels[elements[0].index];
                            if (e.native.ctrlKey) {
                                selectedSemanasFiltro = selectedSemanasFiltro.includes(label) ? selectedSemanasFiltro.filter(x => x !== label) : [...selectedSemanasFiltro, label];
                            } else { selectedSemanasFiltro = selectedSemanasFiltro.includes(label) && selectedSemanasFiltro.length === 1 ? [] : [label]; }
                            applyFilters();
                        }
                    }
                }
            });
        }

        function renderPerformanceCards(dataCards) {
            let maxCD_DBE = 0;
            ['Chancay', 'Ate 1', 'Ate 2'].forEach(centro => {
                let ds = dataCards.filter(x => x.centro === centro);
                let s = ds.reduce((acc, r) => acc + r.surtido, 0);
                let r = ds.reduce((acc, r) => acc + r.rechazado, 0);
                let rate = s > 0 ? (r / s * 100) : 0;
                if(rate > maxCD_DBE) maxCD_DBE = rate;
            });
            if(maxCD_DBE === 0) maxCD_DBE = 5.0;

            buildSingleCard('card-Global', 'Total Operación', dataCards, true, 'Total', maxCD_DBE);
            buildSingleCard('card-Chancay', 'Chancay', dataCards.filter(x => x.centro === 'Chancay'), false, 'Chancay', maxCD_DBE);
            buildSingleCard('card-Ate1', 'Ate 1', dataCards.filter(x => x.centro === 'Ate 1'), false, 'Ate 1', maxCD_DBE);
            buildSingleCard('card-Ate2', 'Ate 2', dataCards.filter(x => x.centro === 'Ate 2'), false, 'Ate 2', maxCD_DBE);
        }

        function buildSingleCard(containerId, titleName, dataset, isGlobalCard, filterKey, maxCD_DBE) {
            let totalSurtido = 0; let totalRechazado = 0; let canalMap = {};
            dataset.forEach(row => { if (!canalMap[row.canal]) canalMap[row.canal] = { s: 0, r: 0 }; });
            dataset.forEach(row => {
                canalMap[row.canal].s += row.surtido; canalMap[row.canal].r += row.rechazado;
                if (expandedState[containerId] && selectedCanalesFiltro.length > 0) {
                    if (selectedCanalesFiltro.includes(row.canal)) { totalSurtido += row.surtido; totalRechazado += row.rechazado; }
                } else { totalSurtido += row.surtido; totalRechazado += row.rechazado; }
            });

            let dbeRate = totalSurtido > 0 ? (totalRechazado / totalSurtido * 100) : 0;
            let fillPercent = Math.min((dbeRate / maxCD_DBE) * 100, 100);
            let metaMarkerPos = Math.min((dbeMeta / maxCD_DBE) * 100, 100);

            let barColor = dbeRate > dbeMeta ? 'bg-rose-500' : 'bg-emerald-500';
            let textColor = dbeRate > dbeMeta ? 'text-rose-600' : 'text-emerald-700';
            let isExpanded = expandedState[containerId];
            let circleHtml = (selectedCentrosFiltro.length === 0 && filterKey === 'Total') || selectedCentrosFiltro.includes(filterKey) ? `<div class="w-3.5 h-3.5 rounded-full bg-indigo-600 flex items-center justify-center text-[8px] text-white font-bold shrink-0 shadow-sm">✓</div>` : `<div class="w-3.5 h-3.5 rounded-full border border-slate-300 bg-slate-100 shrink-0"></div>`;

            let cardHtml = `
                <div class="flex flex-col justify-between h-full font-mono text-slate-800">
                    <div onclick="handleCardClick('${filterKey}', event)">
                        <div class="flex items-center justify-between gap-1">
                            <div class="flex items-center gap-1.5 truncate">${circleHtml} <h4 class="text-[9px] font-black ${isGlobalCard ? 'text-indigo-600' : 'text-slate-700'} uppercase tracking-wider truncate">${titleName}</h4></div>
                            <span class="text-[7.5px] px-1 py-0.5 rounded font-bold shrink-0 ${dbeRate > dbeMeta ? 'bg-rose-100 text-rose-700 border border-rose-200' : 'bg-emerald-100 text-emerald-700 border border-emerald-200'}">${dbeRate > dbeMeta ? 'Desviado' : 'En Meta'}</span>
                        </div>
                        <div class="mt-2">
                            <h2 class="text-2xl font-black ${textColor} tracking-tight">${dbeRate.toFixed(2)}%</h2>
                            <p class="text-[9px] uppercase font-bold text-slate-400 tracking-wide mt-0.5">% DBE Real</p>
                        </div>
                        <div class="mt-2.5 mb-3">
                            <div class="w-full bg-slate-100 rounded-full h-1.5 relative overflow-visible">
                                <div class="${barColor} h-1.5 rounded-full transition-all duration-500" style="width: ${fillPercent}%"></div>
                                <div class="absolute top-[-3px] w-0.5 h-3 bg-slate-400" style="left: ${metaMarkerPos}%;"></div>
                            </div>
                            <div class="flex justify-between text-[8px] text-slate-400 mt-1">
                                <span>0%</span><span>Meta: 2.15%</span><span>Max: ${maxCD_DBE.toFixed(1)}%</span>
                            </div>
                        </div>
                        <div class="flex items-center justify-between text-[10px] text-slate-500 border-t border-slate-100 pt-2">
                            <span>Kg. Surtidos:</span><span class="font-mono text-slate-800 font-semibold">${totalSurtido.toFixed(1).toLocaleString('es-PE')}</span>
                        </div>
                        <div class="flex items-center justify-between text-[10px] text-slate-500 mt-1">
                            <span>Kg. Rechazados:</span><span class="font-mono text-rose-600 font-bold">${totalRechazado.toFixed(1).toLocaleString('es-PE')}</span>
                        </div>
                    </div>
                    <div class="mt-3 border-t border-slate-200 pt-1.5 flex flex-col noclick">
                        <button onclick="toggleCanales('${containerId}', event)" class="w-full flex items-center justify-between text-[9px] font-bold uppercase tracking-wider text-slate-500 hover:text-indigo-600 cursor-pointer py-0.5"><span class="text-[9px]">% DBE por Canal</span><span>${isExpanded ? '▲' : '▼'}</span></button>
                        <div class="${isExpanded ? 'block' : 'hidden'} mt-2 space-y-1.5">
            `;

            Object.keys(canalMap).sort().forEach(canal => {
                let cItem = canalMap[canal] || {s:0, r:0}; let cRate = cItem.s > 0 ? (cItem.r / cItem.s * 100) : 0;
                let canalCircle = selectedCanalesFiltro.includes(canal) ? `<div class="w-2.5 h-2.5 rounded-full bg-indigo-600 border border-indigo-500 flex items-center justify-center text-[6px] text-white font-bold shrink-0">✓</div>` : `<div class="w-2.5 h-2.5 rounded-full border border-slate-300 bg-slate-50 shrink-0"></div>`;
                cardHtml += `
                    <div onclick="handleCanalCircleClick('${canal}', event)" class="flex items-center justify-between gap-1.5 text-[10px] cursor-pointer hover:bg-slate-50 p-0.5 rounded transition-colors noclick">
                        <div class="flex items-center gap-1.5 truncate w-14">${canalCircle} <span class="font-medium text-slate-600 truncate">${canal}</span></div>
                        <div class="flex-1 bg-slate-100 h-1 rounded-full relative overflow-hidden"><div class="${cRate > dbeMeta ? 'bg-rose-500' : 'bg-emerald-500'} h-1 rounded-full" style="width: ${Math.min((cRate / 5) * 100, 100)}%"></div></div>
                        <span class="font-bold font-mono text-right w-9 ${cRate > dbeMeta ? 'text-rose-600' : 'text-emerald-600'}">${cRate.toFixed(1)}%</span>
                    </div>`;
            });
            cardHtml += `</div></div></div>`; document.getElementById(containerId).innerHTML = cardHtml;
        }

        function renderMotivosSubcard(containerId, titleLabel, dataset) {
            let map = {}; dataset.forEach(row => { if (row.rechazado <= 0 || row.motivo === 'SIN ESPECIFICAR') return; if (!map[row.motivo]) map[row.motivo] = { name: row.motivo, r: 0 }; map[row.motivo].r += row.rechazado; });
            let list = Object.values(map).sort((a, b) => b.r - a.r);
            let isExpanded = expandedState[containerId]; let visibleList = isExpanded ? list : list.slice(0, 10);
            let maxRechazo = list.length > 0 ? list[0].r : 1;

            let html = `<div class="flex items-center justify-between border-b border-slate-200 pb-1.5 mb-2.5 font-mono"><h4 class="text-[10px] font-black tracking-wider uppercase text-amber-600">${titleLabel} por Impacto</h4></div><div class="space-y-2.5 max-h-[175px] overflow-y-auto custom-scrollbar pr-1 font-mono">`;
            visibleList.forEach(item => {
                let fillWidth = Math.min((item.r / maxRechazo) * 100, 100);
                html += `
                    <div onclick="handleDimensionItemClick('motivo', '${item.name}', event)" class="text-[10px] cursor-pointer p-0.5 rounded hover:bg-slate-50 transition-all ${selectedMotivosFiltro.includes(item.name) ? 'subitem-active' : ''}">
                        <div class="flex justify-between items-center mb-0.5"><span class="font-bold text-slate-700 truncate max-w-[155px]">${item.name}</span><span class="font-black font-mono text-amber-600">${item.r.toFixed(1)} Kg</span></div>
                        <div class="w-full bg-slate-100 h-1 rounded-full overflow-hidden"><div class="bg-amber-500 h-1 rounded-full" style="width: ${fillWidth}%"></div></div>
                    </div>`;
            });
            html += `</div><button onclick="toggleSubcard('${containerId}')" class="w-full border-t border-slate-200 mt-2 pt-1.5 flex items-center justify-between text-[9px] font-bold uppercase tracking-wider text-slate-400 hover:text-amber-600 cursor-pointer font-mono"><span>Ver Menos</span><span>▲</span></button>`;
            document.getElementById(containerId).innerHTML = html;
        }

        function renderDimensionSubcard(containerId, titleLabel, dataset, groupingKey, filterArray) {
            let map = {}; dataset.forEach(row => { let k = row[groupingKey]; if (!k || k === '-') return; if (!map[k]) map[k] = { name: k, s: 0, r: 0 }; map[k].s += row.surtido; map[k].r += row.rechazado; });
            let list = Object.values(map).map(item => { item.rate = item.s > 0 ? (item.r / item.s * 100) : 0; return item; }).sort((a, b) => b.rate - a.rate);
            let maxDbeInTanda = list.length > 0 ? Math.max(...list.map(x => x.rate)) : 1;
            let isExpanded = expandedState[containerId]; let visibleList = isExpanded ? list : list.slice(0, 10);

            let subhtml = `<div class="flex items-center justify-between border-b border-slate-200 pb-1.5 mb-2.5 font-mono"><h4 class="text-[10px] font-black tracking-wider uppercase text-indigo-600">${titleLabel} Críticos</h4></div><div class="space-y-2.5 max-h-[175px] overflow-y-auto custom-scrollbar pr-1 font-mono">`;
            visibleList.forEach(item => {
                subhtml += `
                    <div onclick="handleDimensionItemClick('${groupingKey}', '${item.name}', event)" class="text-[10px] cursor-pointer p-0.5 rounded hover:bg-slate-50 transition-all ${filterArray.includes(item.name) ? 'subitem-active' : ''}">
                        <div class="flex justify-between items-center mb-0.5">
                            <span class="font-mono font-bold text-slate-700 truncate max-w-[100px]">${item.name}</span>
                            <span class="text-slate-500 font-mono text-[9px]">${item.r.toFixed(1)} kg</span>
                            <span class="font-black font-mono ${item.rate > dbeMeta ? 'text-rose-600' : 'text-emerald-600'}">${item.rate.toFixed(2)}%</span>
                        </div>
                        <div class="w-full bg-slate-100 h-1 rounded-full overflow-hidden"><div class="${item.rate > dbeMeta ? 'bg-rose-500' : 'bg-emerald-500'} h-1 rounded-full" style="width: ${Math.min((item.rate / maxDbeInTanda) * 100, 100)}%"></div></div>
                    </div>`;
            });
            subhtml += `</div><button onclick="toggleSubcard('${containerId}')" class="w-full border-t border-slate-200 mt-2 pt-1.5 flex items-center justify-between text-[9px] font-bold uppercase tracking-wider text-slate-400 hover:text-indigo-600 cursor-pointer font-mono"><span>Ver Menos</span><span>▲</span></button>`;
            document.getElementById(containerId).innerHTML = subhtml;
        }

        function renderMasterTable(dataset) {
            let customerMap = {}; dataset.forEach(row => { if (row.rechazado <= 0) return; let key = row.codClie; if (!customerMap[key]) { customerMap[key] = { fecha: row.fecha, cod: row.codClie, name: row.cliente, ruta: row.rutaVenta, canal: row.canal, veh: row.vehiculo, tipo: row.tipoUnidad, mot: row.motivo, surtidoTotal: 0, rechazadoTotal: 0 }; } customerMap[key].surtidoTotal += row.surtido; customerMap[key].rechazadoTotal += row.rechazado; });
            let listWithRechazo = Object.values(customerMap).sort((a, b) => b.rechazadoTotal - a.rechazadoTotal);
            let isExpanded = expandedState['master-table']; let visibleList = isExpanded ? listWithRechazo : listWithRechazo.slice(0, 10);
            const tbody = document.getElementById('masterTableBody'); tbody.innerHTML = '';
            visibleList.forEach(c => {
                let tr = document.createElement('tr'); tr.className = "hover:bg-slate-50 border-b border-slate-100 font-mono text-slate-700";
                tr.innerHTML = `<td class="p-2 text-indigo-600 font-medium">${c.fecha}</td><td class="p-2 text-slate-400">${c.cod}</td><td class="p-2 font-medium text-slate-800 truncate max-w-[120px]">${c.name}</td><td class="p-2 text-slate-500">${c.ruta}</td><td class="p-2 text-slate-500">${c.canal}</td><td class="p-2 text-slate-400">${c.veh}</td><td class="p-2 font-bold ${c.tipo === 'PROPIO' ? 'text-indigo-600' : c.tipo === '3PL' ? 'text-amber-600' : 'text-purple-600'}">${c.tipo}</td><td class="p-2 truncate max-w-[110px] text-amber-600">${c.mot}</td><td class="p-2 text-right text-slate-400">${c.surtidoTotal.toFixed(1)}</td><td class="p-2 text-right text-rose-600 font-black">${c.rechazadoTotal.toFixed(1)} Kg</td>`; tbody.appendChild(tr);
            });
            document.getElementById('table-view-status').innerText = `Mostrando ${visibleList.length} de ${listWithRechazo.length} clientes con rechazo`;
        }

        function renderMapMarkers(dataset) {
            if (!markersGroup) return; markersGroup.clearLayers();
            let validPoints = dataset.filter(x => x.rechazado > 0 && x.lat !== 0);
            validPoints.forEach(p => {
                let circleMarker = L.circleMarker([p.lat, p.lng], { radius: Math.max(5, Math.min(p.rechazado / 8, 14)), fillColor: '#e11d48', color: '#ffffff', weight: 1.5, fillOpacity: 0.75 });
                circleMarker.bindPopup(`<div style="font-family:'Inter',sans-serif; font-size:11px;"><b>${p.cliente}</b><br/><b>Rechazado:</b> <span style="color:#e11d48;font-weight:bold;">${p.rechazado.toFixed(1)} Kg</span></div>`); markersGroup.addLayer(circleMarker);
            });
            if (validPoints.length > 0 && mapInstance) mapInstance.fitBounds(validPoints.map(x => [x.lat, x.lng]), { padding: [25, 25], maxZoom: 14 });
        }

        function renderTrendChart(dataTrend) {
            let fMap = {}; dataTrend.forEach(r => { if(!fMap[r.numDia]) fMap[r.numDia] = {s:0, r:0}; fMap[r.numDia].s += r.surtido; fMap[r.numDia].r += r.rechazado; });
            let sortedDays = Object.keys(fMap).sort((a,b) => parseInt(a) - parseInt(b));
            if(trendChart) trendChart.destroy();
            const ctx = document.getElementById('chartTrend').getContext('2d');
            trendChart = new Chart(ctx, {
                plugins: [trendLabelsPlugin],
                data: {
                    labels: sortedDays,
                    datasets: [
                        { type: 'line', label: '% DBE Diario', data: sortedDays.map(d => fMap[d].s > 0 ? (fMap[d].r / fMap[d].s * 100).toFixed(2) : 0), borderColor: '#4f46e5', backgroundColor: 'transparent', borderWidth: 2, tension: 0.1, yAxisID: 'y', z: 10 },
                        { type: 'bar', label: 'Kg. Rechazados', data: sortedDays.map(d => fMap[d].r.toFixed(0)), backgroundColor: 'rgba(245, 158, 11, 0.28)', borderColor: 'rgba(245, 158, 11, 0.6)', borderWidth: 1, borderRadius: 3, yAxisID: 'y1', z: 1 }
                    ]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                    layout: { padding: { top: 18, bottom: 5, left: 10, right: 10 } },
                    scales: { 
                        y: { position: 'left', beginAtZero: true, grid: { display: false }, ticks: { display: false }, border: { display: false } }, 
                        y1: { position: 'right', beginAtZero: true, grid: { display: false }, ticks: { display: false }, border: { display: false } }, 
                        x: { grid: { display: false }, ticks: { font: { size: 9, weight: 'bold' } } }
                    } 
                }
            });
        }

        function downloadExcelComas() {
            let aggregatedExcelMap = {}; filteredData.forEach(row => { if (row.rechazado <= 0) return; if (!aggregatedExcelMap[row.codClie]) aggregatedExcelMap[row.codClie] = { ...row, surtido: 0, rechazado: 0 }; aggregatedExcelMap[row.codClie].surtido += row.surtido; aggregatedExcelMap[row.codClie].rechazado += row.rechazado; });
            let csvContent = "\uFEFFFecha,Código,Cliente,Ruta,Canal,Vehículo,Tipo Unidad,Motivo,Surtido (Kg),Rechazado (Kg)\n";
            Object.values(aggregatedExcelMap).forEach(c => { csvContent += `"${c.fecha}","${c.codClie}","${c.cliente}","${c.rutaVenta}","${c.canal}","${c.vehiculo}","${c.tipoUnidad}","${c.motivo}",${c.surtido.toFixed(1)},${c.rechazado.toFixed(1)}\n`; });
            let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }); let link = document.createElement("a"); link.setAttribute("href", URL.createObjectURL(blob)); link.setAttribute("download", "Reporte_Maestro_DBE_Sigma.csv"); document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }
    </script>
</body>
</html>
