    <!-- FILA 1: CALENDARIO IZQUIERDO + TARGETAS DE PERFORMANCE MÁSTER -->
    <div class="w-full shrink-0 overflow-x-auto overflow-y-hidden custom-scrollbar pb-1">
        <section class="flex flex-row flex-nowrap gap-3 items-start justify-between w-full min-w-[1180px]">
            <!-- Calendario Izquierdo -->
            <div class="w-[230px] shrink-0 bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-lg flex flex-col justify-between">

            <!-- Las 4 tarjetas operativas -->

            <div id="card-Chancay" onclick="handleCardClick('Chancay', event)" class="w-[215px] shrink-0 bg-slate-900 border border-slate-800 rounded-2xl p-3.5 shadow-lg flex flex-col justify-between transition-all duration-200 cursor-pointer"></div>

            <div id="card-Ate2" onclick="handleCardClick('Ate 2', event)" class="w-[215px] shrink-0 bg-slate-900 border border-slate-800 rounded-2xl p-3.5 shadow-lg flex flex-col justify-between transition-all duration-200 cursor-pointer"></div>

    <!-- FILA 2: GRÁFICO DE EVOLUCIÓN MENSUAL (Sin Título) -->
    <section class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-xl flex flex-col h-[230px] w-full">
        <div class="w-full flex-1 min-h-0 relative">
            <canvas id="chartTrend"></canvas>

    <!-- FILA 3: SEGUNDA LÍNEA DE CARDS DE DETALLE CRÍTICO INTERACTIVO -->
    <div class="w-full shrink-0 overflow-x-auto overflow-y-hidden custom-scrollbar pb-1">
        <section class="flex flex-row flex-nowrap gap-3 items-start justify-between w-full min-w-[1180px]">
            <div id="subcard-motivo" class="flex-1 min-w-[275px] bg-slate-900 border border-slate-800 rounded-2xl p-3.5 shadow-xl transition-all"></div>
            <div id="subcard-vehiculo" class="flex-1 min-w-[275px] bg-slate-900 border border-slate-800 rounded-2xl p-3.5 shadow-xl transition-all"></div>
            <div id="subcard-ruta" class="flex-1 min-w-[275px] bg-slate-900 border border-slate-800 rounded-2xl p-3.5 shadow-xl transition-all"></div>
            <div id="subcard-distrito" class="flex-1 min-w-[275px] bg-slate-900 border border-slate-800 rounded-2xl p-3.5 shadow-xl transition-all"></div>
        </section>
    </div>

    <!-- FILA 4: NUEVA SECCIÓN DE CONTROL DETALLADO Y MAPA DE UBICACIONES -->
    <section class="grid grid-cols-1 xl:grid-cols-3 gap-4 items-stretch w-full min-h-[400px]">
        <!-- Bloque Izquierdo: Tabla Detalle Maestro de Despacho (Ocupa 2 columnas) -->
        <div class="xl:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between shadow-xl">
            <div>
                <div class="flex items-center justify-between border-b border-slate-800 pb-2 mb-3">
                    <h3 class="text-xs font-black tracking-wider uppercase text-indigo-400">Detalle Operativo Maestro de Despachos</h3>
                    <span id="table-view-status" class="text-[9px] font-mono text-slate-500">Top 10 Ordenado por Surtido</span>
                </div>
                <div class="overflow-x-auto custom-scrollbar max-h-[340px]">
                    <table class="w-full text-left border-collapse text-[11px]">
                        <thead>
                            <tr class="bg-slate-950/60 text-slate-400 font-bold border-b border-slate-800">
                                <th class="p-2 font-mono">Código</th>
                                <th class="p-2 truncate max-w-[140px]">Cliente</th>

                                <th class="p-2 text-right">Rechazado</th>

                <span id="btnTableText">Ver Todos los Despachos</span>
                <span id="btnTableArrow">▼</span>
            </button>

        <!-- Bloque Derecho: Mapa Georreferenciado de Incidencias y Rechazos -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col shadow-xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2 mb-3">
                <h3 class="text-xs font-black tracking-wider uppercase text-rose-400">Ubicación y Georreferenciación de Rechazos</h3>
                <span class="text-[9px] text-slate-500 font-mono">Lima Metropolitana</span>
            </div>
            <!-- Div donde Leaflet inyectará el mapa real -->
            <div id="mapContainer" class="flex-1 w-full rounded-xl bg-slate-950 border border-slate-800 min-h-[300px] z-10"></div>
        </div>
    </section>

    <script>
        const csvUrl = 'https://raw.githubusercontent.com/sigmaperu/DashBoards/refs/heads/main/BD_DBE_Julio_2026.csv';
        let rawData = [];
        let filteredData = [];
        let selectedDia = 'ALL';
        const dbeMeta = 2.15;

        // Estados de Multi-Selección Cruzada (Fila 1 y Fila 3)
        let selectedCentrosFiltro = [];
        let selectedCanalesFiltro = []; 
        let selectedVehiculosFiltro = [];
        let selectedRutasFiltro = [];
        let selectedDistritosFiltro = [];
        let selectedMotivosFiltro = [];

        let trendChart = null;
        let mapInstance = null;
        let markersGroup = null;

        let expandedState = {
            'card-Global': false, 'card-Chancay': false, 'card-Ate1': false, 'card-Ate2': false,
            'subcard-motivo': false, 'subcard-vehiculo': false, 'subcard-ruta': false, 'subcard-distrito': false,
            'master-table': false
        };

        const centroMapping = { "0374": "Ate 1", "0752": "Chorrillos", "0754": "Chancay", "0780": "Ate 2" };

        document.addEventListener('DOMContentLoaded', () => { buildCalendarGrid(); initMap(); loadData(); });

        function initMap() {
            // Inicializar mapa centrado en Lima Metropolitana
            mapInstance = L.map('mapContainer', { zoomControl: false }).setView([-12.046374, -77.042793], 11);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            }).addTo(mapInstance);
            markersGroup = L.layerGroup().addTo(mapInstance);
        }

        function buildCalendarGrid() {
            const grid = document.getElementById('calendarGrid'); grid.innerHTML = '';
            const diaInicioSemana = 3; const totalDiasMes = 31;
            for (let s = 0; s < diaInicioSemana; s++) grid.appendChild(document.createElement('div'));
            for (let d = 1; d <= totalDiasMes; d++) {
                const diaStr = String(d).padStart(2, '0');
                const btn = document.createElement('button');
                btn.className = "day-btn text-[9px] py-1 border border-slate-800 rounded-md bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all text-center cursor-pointer font-medium";
                btn.id = `btn-day-${diaStr}`; btn.innerText = d;
                btn.onclick = () => selectDiaCalendario(diaStr);
                grid.appendChild(btn);
            }
        }

        async function loadData() {
            try {
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error('Error GitHub');
                const text = await response.text();
                parseCSV(text);
                applyFilters();
            } catch (err) {
                generateMockData();
                applyFilters();
            }
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/); rawData = [];
            for (let i = 1; i < lines.length; i++) {
                let line = lines[i].trim(); if (!line) continue;
                let cols = []; let insideQuote = false; let current = "";
                for (let j = 0; j < line.length; j++) {
                    let char = line[j];
                    if (char === '"') insideQuote = !insideQuote;
                    else if (char === ',' && !insideQuote) { cols.push(current.trim()); current = ""; }
                    else current += char;
                }
                cols.push(current.trim());
                if (cols.length < 37) continue;

                let rawCentro = cols[1] || ''; if (!rawCentro || rawCentro === "null") continue;
                let centroNombre = centroMapping[rawCentro] || rawCentro;
                let fechaStr = cols[9] || '7/1/2026';
                let diaFicticio = '01'; if (fechaStr.includes('/')) diaFicticio = fechaStr.split('/')[1].trim().padStart(2, '0');

                let canalNombre = cols[2] || 'OTROS';
                if(canalNombre.toLowerCase() === 'otros') canalNombre = 'OTROS';

                let motivoRechazo = cols[36] || 'SIN ESPECIFICAR';
                if(motivoRechazo === '-' || !motivoRechazo) motivoRechazo = 'SIN ESPECIFICAR';
                motivoRechazo = motivoRechazo.toUpperCase();

                // Capturar coordenadas reales o asignar base de Lima si son nulas o nulas ficticias
                let lat = parseFloat(cols[19]);
                let lng = parseFloat(cols[20]);
                if (isNaN(lat) || lat === 0) lat = -12.0463 + (Math.random() - 0.5) * 0.15;
                if (isNaN(lng) || lng === 0) lng = -77.0427 + (Math.random() - 0.5) * 0.15;

                rawData.push({
                    centro: centroNombre, canal: canalNombre,
                    codClie: cols[5] || '000000',
                    cliente: cols[6] || 'CLIENTE OPERATIVO',
                    vehiculo: cols[4] || 'No Especificado',
                    rutaVenta: cols[7] || 'Sin Ruta',
                    distrito: (cols[15] || 'OTROS').toUpperCase(),
                    motivo: motivoRechazo,
                    lat: lat, lng: lng,
                    fecha: fechaStr, numDia: diaFicticio,
                    surtido: parseFloat(cols[31]) || 0, rechazado: parseFloat(cols[34]) || 0
                });
            }
        }

        function generateMockData() {
            const centros = ['Ate 1', 'Chancay', 'Ate 2'];
            const canales = ['FSE', 'MOD', 'DET', 'OTROS'];
            const vehicles = ['C2I-891', 'BNY-776', 'AKL-733', 'BSX-809'];
            const distritos = ['ATE', 'COMAS', 'SAN BORJA', 'CHORRILLOS', 'CHANCAY'];
            const motivos = ['RECEPCIÓN NO RECIBE', 'TIENDA CERRADA', 'FUERA HORA DE RECEPC', 'DIFERENCIAS CEDI'];
            for (let day = 1; day <= 31; day++) {
                let formattedDay = String(day).padStart(2, '0');
                for (let k = 0; k < 15; k++) {
                    let surtido = Math.floor(Math.random() * 2000) + 300;
                    let rechazado = Math.random() > 0.75 ? Math.floor(Math.random() * surtido * 0.06) : 0;
                    rawData.push({
                        centro: centros[Math.floor(Math.random() * centros.length)],
                        canal: canales[Math.floor(Math.random() * canales.length)],
                        codClie: '117' + (4000 + k),
                        cliente: 'DISTRIBUIDORA LIMA CLIENTE ' + k,
                        vehiculo: vehicles[Math.floor(Math.random() * vehicles.length)],
                        rutaVenta: 'B6' + String.fromCharCode(65 + Math.floor(Math.random() * 4)),
                        distrito: distritos[Math.floor(Math.random() * distritos.length)],
                        motivo: rechazado > 0 ? motivos[Math.floor(Math.random() * motivos.length)] : 'SIN ESPECIFICAR',
                        lat: -12.0463 + (Math.random() - 0.5) * 0.18,
                        lng: -77.0427 + (Math.random() - 0.5) * 0.18,
                        fecha: `7/${day}/2026`, numDia: formattedDay,
                        surtido: surtido, rechazado: rechazado
                    });
                }
            }
        }

        function selectDiaCalendario(dia) {
            selectedDia = dia;
            document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
            const btnAll = document.getElementById('btnDayAll');
            if (dia === 'ALL') { btnAll.classList.add('bg-indigo-600', 'text-white'); } 
            else { btnAll.classList.remove('bg-indigo-600', 'text-white'); const targetBtn = document.getElementById(`btn-day-${dia}`); if (targetBtn) targetBtn.classList.add('active'); }
            applyFilters();
        }

        // CONTROL MULTI-SELECT FILA 1
        window.handleCardClick = function(centroName, event) {
            if(event.target.closest('.noclick')) return;
            if (centroName === 'Total Operación') { selectedCentrosFiltro = []; } else {
                if (event.ctrlKey) {
                    if (selectedCentrosFiltro.includes(centroName)) selectedCentrosFiltro = selectedCentrosFiltro.filter(x => x !== centroName);
                    else selectedCentrosFiltro.push(centroName);
                } else {
                    if (selectedCentrosFiltro.length === 1 && selectedCentrosFiltro[0] === centroName) selectedCentrosFiltro = [];
                    else selectedCentrosFiltro = [centroName];
                }
            }
            applyFilters();
        };

        window.handleCanalCircleClick = function(canalName, event) {
            event.stopPropagation();
            if (event.ctrlKey) {
                if (selectedCanalesFiltro.includes(canalName)) selectedCanalesFiltro = selectedCanalesFiltro.filter(x => x !== canalName);
                else selectedCanalesFiltro.push(canalName);
            } else {
                if (selectedCanalesFiltro.length === 1 && selectedCanalesFiltro[0] === canalName) selectedCanalesFiltro = [];
                else selectedCanalesFiltro = [canalName];
            }
            applyFilters();
        };

        // INTERACTIVIDAD DE FILTRADO MULTI-SELECT CON CTRL PARA LA FILA 3
        window.handleDimensionItemClick = function(dimensionKey, value, event) {
            let targetArray;
            if (dimensionKey === 'motivo') targetArray = selectedMotivosFiltro;
            else if (dimensionKey === 'vehiculo') targetArray = selectedVehiculosFiltro;
            else if (dimensionKey === 'rutaVenta') targetArray = selectedRutasFiltro;
            else if (dimensionKey === 'distrito') targetArray = selectedDistritosFiltro;

            if (event.ctrlKey) {
                if (targetArray.includes(value)) {
                    targetArray.splice(targetArray.indexOf(value), 1);
                } else {
                    targetArray.push(value);
                }
            } else {
                if (targetArray.length === 1 && targetArray[0] === value) {
                    targetArray.length = 0; // Vaciar array limpio
                } else {
                    targetArray.length = 0;
                    targetArray.push(value);
                }
            }
            applyFilters();
        };

        window.toggleCanales = function(containerId, event) {
            if(event) event.stopPropagation();
            expandedState[containerId] = !expandedState[containerId];
            applyFilters();
        };

        window.toggleSubcard = function(subcardId) {
            expandedState[subcardId] = !expandedState[subcardId];
            applyFilters();
        };

        window.toggleTableExpansion = function() {
            expandedState['master-table'] = !expandedState['master-table'];
            applyFilters();
        };

        function applyFilters() {
            // 1. Data filtrada por el Calendario
            let dataTemporal = rawData.filter(row => {
                if (selectedDia !== 'ALL' && row.numDia !== selectedDia) return false;
                return true;
            });

            renderPerformanceCards(dataTemporal);

            // 2. Data filtrada por Fila 1 (CD + Canal) para alimentar Fila 3 de desgloses
            let dataFila1 = dataTemporal.filter(row => {
                if (selectedCentrosFiltro.length > 0 && !selectedCentrosFiltro.includes(row.centro)) return false;
                if (selectedCanalesFiltro.length > 0 && !selectedCanalesFiltro.includes(row.canal)) return false;
                return true;
            });

            renderMotivosSubcard('subcard-motivo', 'Motivo', dataFila1);
            renderDimensionSubcard('subcard-vehiculo', 'Vehículo Placa', dataFila1, 'vehiculo', selectedVehiculosFiltro);
            renderDimensionSubcard('subcard-ruta', 'Ruta Venta', dataFila1, 'rutaVenta', selectedRutasFiltro);
            renderDimensionSubcard('subcard-distrito', 'Distrito', dataFila1, 'distrito', selectedDistritosFiltro);

            // 3. DATA MAESTRA CRUZADA TOTAL (Para la Tabla del Top Ten y los Pines del Mapa)
            let dataMaestraFinal = dataFila1.filter(row => {
                if (selectedMotivosFiltro.length > 0 && !selectedMotivosFiltro.includes(row.motivo)) return false;
                if (selectedVehiculosFiltro.length > 0 && !selectedVehiculosFiltro.includes(row.vehiculo)) return false;
                if (selectedRutasFiltro.length > 0 && !selectedRutasFiltro.includes(row.rutaVenta)) return false;
                if (selectedDistritosFiltro.length > 0 && !selectedDistritosFiltro.includes(row.distrito)) return false;
                return true;
            });

            renderMasterTable(dataMaestraFinal);
            renderMapMarkers(dataMaestraFinal);

            // 4. Gráfico evolutivo histórico de tendencia
            let dataParaGraficoTrend = rawData.filter(row => {
                if (selectedCentrosFiltro.length > 0 && !selectedCentrosFiltro.includes(row.centro)) return false;
                if (selectedCanalesFiltro.length > 0 && !selectedCanalesFiltro.includes(row.canal)) return false;
                return true;
            });
            setTimeout(() => { renderTrendChart(dataParaGraficoTrend); }, 60);
        }

        function renderPerformanceCards(dataCards) {
            const updateClasses = (id, target) => {
                const el = document.getElementById(id);
                if (selectedCentrosFiltro.length > 0 && !selectedCentrosFiltro.includes(target) && target !== 'Total') el.classList.add('card-inactive');
                else el.classList.remove('card-inactive');
            };
            updateClasses('card-Global', 'Total'); updateClasses('card-Chancay', 'Chancay'); updateClasses('card-Ate1', 'Ate 1'); updateClasses('card-Ate2', 'Ate 2');

            buildSingleCard('card-Global', 'Total Operación', dataCards, true, 'Total');
            buildSingleCard('card-Chancay', 'Chancay', dataCards.filter(x => x.centro === 'Chancay'), false, 'Chancay');
            buildSingleCard('card-Ate1', 'Ate 1', dataCards.filter(x => x.centro === 'Ate 1'), false, 'Ate 1');
            buildSingleCard('card-Ate2', 'Ate 2', dataCards.filter(x => x.centro === 'Ate 2'), false, 'Ate 2');
        }

        function buildSingleCard(containerId, titleName, dataset, isGlobalCard, filterKey) {
            let totalSurtido = 0; let totalRechazado = 0; let canalMap = {};
            dataset.forEach(row => { if (!canalMap[row.canal]) canalMap[row.canal] = { s: 0, r: 0 }; });
            dataset.forEach(row => {
                canalMap[row.canal].s += row.surtido; canalMap[row.canal].r += row.rechazado;
                if (expandedState[containerId] && selectedCanalesFiltro.length > 0) {
                    if (selectedCanalesFiltro.includes(row.canal)) { totalSurtido += row.surtido; totalRechazado += row.rechazado; }
                } else { totalSurtido += row.surtido; totalRechazado += row.rechazado; }
            });

            let dbeRate = totalSurtido > 0 ? (totalRechazado / totalSurtido * 100) : 0;
            let fillPercent = Math.min((dbeRate / dbeMeta) * 100, 100);
            let barColor = dbeRate > dbeMeta ? 'bg-rose-500' : 'bg-emerald-500';
            let textColor = dbeRate > dbeMeta ? 'text-rose-400' : 'text-emerald-400';
            let isExpanded = expandedState[containerId];

            let circleHtml = (selectedCentrosFiltro.length === 0 && filterKey === 'Total') || selectedCentrosFiltro.includes(filterKey)
                ? `<div class="w-3.5 h-3.5 rounded-full bg-indigo-500 border border-indigo-400 flex items-center justify-center text-[8px] text-white font-bold shrink-0 shadow-[0_0_8px_rgba(99,102,241,0.5)]">✓</div>`
                : `<div class="w-3.5 h-3.5 rounded-full border border-slate-600 bg-slate-800 shrink-0"></div>`;

            let cardHtml = `
                <div class="flex flex-col justify-between h-full">
                    <div>
                        <div class="flex items-center justify-between gap-1">
                            <div class="flex items-center gap-1.5 truncate">
                                ${circleHtml}
                                <h4 class="text-[9px] font-black ${isGlobalCard ? 'text-indigo-400' : 'text-slate-300'} uppercase tracking-wider truncate">${titleName}</h4>
                            </div>
                            <span class="text-[7.5px] px-1 py-0.5 rounded font-bold shrink-0 ${dbeRate > dbeMeta ? 'bg-rose-500/10 text-rose-400 border border-rose-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'}">
                                ${dbeRate > dbeMeta ? 'Desviado' : 'En Meta'}
                            </span>
                        </div>
                        <div class="mt-2.5">
                            <h2 class="text-xl font-black ${dbeRate > dbeMeta ? 'text-rose-500' : 'text-emerald-400'} tracking-tight">${Math.round(totalRechazado).toLocaleString('es-PE')}</h2>
                            <p class="text-[9px] uppercase font-bold text-slate-500 tracking-wide mt-0.5">Kg. Rechazados</p>
                        </div>
                        <div class="flex items-center justify-between mt-2.5 text-[10px] text-slate-400 border-t border-slate-800/60 pt-1.5">
                            <span>Kg. Surtidos:</span>
                            <span class="font-mono text-slate-300 font-semibold">${Math.round(totalSurtido).toLocaleString('es-PE')}</span>
                        </div>
                        <div class="mt-2.5">
                            <div class="flex justify-between text-[9px] font-bold uppercase tracking-wider text-slate-400 mb-1">
                                <span>% DBE: <b class="${textColor}">${dbeRate.toFixed(2)}%</b></span>
                                <span>Meta: 2.15%</span>
                            </div>
                            <div class="w-full bg-slate-800 rounded-full h-1 relative overflow-hidden">
                                <div class="${barColor} h-1 rounded-full transition-all duration-500" style="width: ${fillPercent}%"></div>
                                <div class="absolute left-[71.6%] top-0 w-0.5 h-1 bg-white/30 z-10"></div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3 border-t border-slate-800/60 pt-1.5 flex flex-col noclick">
                        <button onclick="toggleCanales('${containerId}', event)" class="w-full flex items-center justify-between text-[9px] font-bold uppercase tracking-wider text-slate-400 hover:text-indigo-400 transition-colors cursor-pointer py-0.5">
                            <span>% DBE por Canal</span>
                            <span class="text-[9px] transition-transform duration-200">${isExpanded ? '▲' : '▼'}</span>
                        </button>
                        <div class="${isExpanded ? 'block' : 'hidden'} mt-2 space-y-1.5">
            `;

            Object.keys(canalMap).sort().forEach(canal => {
                let cItem = canalMap[canal] || {s:0, r:0}; let cRate = cItem.s > 0 ? (cItem.r / cItem.s * 100) : 0;
                let cWidth = Math.min((cRate / 5) * 100, 100);
                let cColor = cRate > dbeMeta ? 'bg-rose-500' : 'bg-emerald-500';
                let cText = cRate > dbeMeta ? 'text-rose-400' : 'text-emerald-400';
                let canalCircle = selectedCanalesFiltro.includes(canal)
                    ? `<div class="w-2.5 h-2.5 rounded-full bg-indigo-500 border border-indigo-400 flex items-center justify-center text-[6px] text-white font-bold shrink-0">✓</div>`
                    : `<div class="w-2.5 h-2.5 rounded-full border border-slate-600 bg-slate-800 shrink-0"></div>`;

                cardHtml += `
                    <div onclick="handleCanalCircleClick('${canal}', event)" class="flex items-center justify-between gap-1.5 text-[10px] cursor-pointer hover:bg-slate-800/40 p-0.5 rounded transition-colors noclick">
                        <div class="flex items-center gap-1.5 truncate w-14">
                            ${canalCircle} <span class="font-medium text-slate-400 truncate">${canal}</span>
                        </div>
                        <div class="flex-1 bg-slate-800/80 h-1 rounded-full relative overflow-hidden">
                            <div class="${cColor} h-1 rounded-full" style="width: ${cWidth}%"></div>
                        </div>
                        <span class="font-bold font-mono text-right w-9 ${cText}">${cRate.toFixed(1)}%</span>
                    </div>
                `;
            });
            cardHtml += `</div></div></div>`;
            document.getElementById(containerId).innerHTML = cardHtml;
        }

        function renderMotivosSubcard(containerId, titleLabel, dataset) {
            let map = {};
            dataset.forEach(row => {
                if (row.rechazado <= 0 || row.motivo === 'SIN ESPECIFICAR') return;
                if (!map[row.motivo]) map[row.motivo] = { name: row.motivo, r: 0 };
                map[row.motivo].r += row.rechazado;
            });

            let list = Object.values(map).sort((a, b) => b.r - a.r);
            let isExpanded = expandedState[containerId];
            let visibleList = isExpanded ? list : list.slice(0, 10);
            let maxRechazo = list.length > 0 ? list[0].r : 1;

            let html = `
                <div class="flex items-center justify-between border-b border-slate-800 pb-1.5 mb-2.5">
                    <h4 class="text-[10px] font-black tracking-wider uppercase text-amber-500">${titleLabel} por Impacto</h4>
                    <span class="text-[9px] text-slate-500 font-mono">${isExpanded ? 'Universo' : 'Top 10'}</span>
                </div>
                <div class="space-y-2.5 max-h-[175px] overflow-y-auto custom-scrollbar pr-1">
            `;

            visibleList.forEach(item => {
                let fillWidth = Math.min((item.r / maxRechazo) * 100, 100);
                let isActive = selectedMotivosFiltro.includes(item.name);
                html += `
                    <div onclick="handleDimensionItemClick('motivo', '${item.name}', event)" class="text-[10px] cursor-pointer p-0.5 rounded hover:bg-slate-800/60 transition-all ${isActive ? 'subitem-active' : ''}">
                        <div class="flex justify-between items-center mb-0.5">
                            <span class="font-bold text-slate-300 truncate max-w-[155px]" title="${item.name}">${item.name}</span>
                            <span class="font-black font-mono text-amber-500">${Math.round(item.r).toLocaleString('es-PE')} Kg</span>
                        </div>
                        <div class="w-full bg-slate-800 h-1 rounded-full overflow-hidden">
                            <div class="bg-amber-500 h-1 rounded-full transition-all" style="width: ${fillWidth}%"></div>
                        </div>
                    </div>
                `;
            });

            html += `</div><button onclick="toggleSubcard('${containerId}')" class="w-full border-t border-slate-800/60 mt-2 pt-1.5 flex items-center justify-between text-[9px] font-bold uppercase tracking-wider text-slate-500 hover:text-amber-500 cursor-pointer"><span>${isExpanded ? 'Contraer' : 'Ver Todos'}</span><span>${isExpanded ? '▲' : '▼'}</span></button>`;
            document.getElementById(containerId).innerHTML = html;
        }

        function renderDimensionSubcard(containerId, titleLabel, dataset, groupingKey, filterArray) {
            let map = {};
            dataset.forEach(row => {
                let k = row[groupingKey]; if (!k || k === '-') return;
                if (!map[k]) map[k] = { name: k, s: 0, r: 0 };
                map[k].s += row.surtido; map[k].r += row.rechazado;
            });

            let list = Object.values(map).map(item => {
                item.rate = item.s > 0 ? (item.r / item.s * 100) : 0;
                return item;
            }).sort((a, b) => b.rate - a.rate);

            let maxDbeInTanda = list.length > 0 ? Math.max(...list.map(x => x.rate)) : 1;
            if(maxDbeInTanda === 0) maxDbeInTanda = 1;

            let isExpanded = expandedState[containerId];
            let visibleList = isExpanded ? list : list.slice(0, 10);

            let subhtml = `
                <div class="flex items-center justify-between border-b border-slate-800 pb-1.5 mb-2.5">
                    <h4 class="text-[10px] font-black tracking-wider uppercase text-indigo-400">${titleLabel} Críticos</h4>
                    <span class="text-[9px] text-slate-500 font-mono">${isExpanded ? 'Universo' : 'Top 10'}</span>
                </div>
                <div class="space-y-2.5 max-h-[175px] overflow-y-auto custom-scrollbar pr-1">
            `;

            visibleList.forEach(item => {
                let colBar = item.rate > dbeMeta ? 'bg-rose-500' : 'bg-emerald-500';
                let colText = item.rate > dbeMeta ? 'text-rose-400' : 'text-emerald-400';
                let fillW = Math.min((item.rate / maxDbeInTanda) * 100, 100);
                let isActive = filterArray.includes(item.name);

                subhtml += `
                    <div onclick="handleDimensionItemClick('${groupingKey}', '${item.name}', event)" class="text-[10px] cursor-pointer p-0.5 rounded hover:bg-slate-800/60 transition-all ${isActive ? 'subitem-active' : ''}">
                        <div class="flex justify-between items-center mb-0.5">
                            <span class="font-mono font-bold text-slate-300 truncate max-w-[100px]" title="${item.name}">${item.name}</span>
                            <span class="text-slate-500 font-mono text-[9px]">${Math.round(item.r)}/${Math.round(item.s)} kg</span>
                            <span class="font-black font-mono ${colText}">${item.rate.toFixed(2)}%</span>
                        </div>
                        <div class="w-full bg-slate-800 h-1 rounded-full overflow-hidden">
                            <div class="${colBar} h-1 rounded-full transition-all" style="width: ${fillW}%"></div>
                        </div>
                    </div>
                `;
            });

            subhtml += `</div><button onclick="toggleSubcard('${containerId}')" class="w-full border-t border-slate-800/60 mt-2 pt-1.5 flex items-center justify-between text-[9px] font-bold uppercase tracking-wider text-slate-500 hover:text-indigo-400 cursor-pointer"><span>${isExpanded ? 'Contraer' : 'Ver Todos'}</span><span>${isExpanded ? '▲' : '▼'}</span></button>`;
            document.getElementById(containerId).innerHTML = subhtml;
        }

        // NUEVA FUNCIÓN: Genera la Tabla Maestra consolidando y agrupando por Cliente con ordenamiento de mayor a menor Surtido
        function renderMasterTable(dataset) {
            let customerMap = {};
            dataset.forEach(row => {
                let key = row.codClie + '_' + row.cliente;
                if (!customerMap[key]) {
                    customerMap[key] = {
                        cod: row.codClie, name: row.cliente, ruta: row.rutaVenta,
                        canal: row.canal, veh: row.vehiculo, mot: row.motivo,
                        s: 0, r: 0
                    };
                }
                customerMap[key].s += row.surtido;
                customerMap[key].r += row.rechazado;
            });

            let list = Object.values(customerMap).sort((a, b) => b.s - a.s); // Ordenado estricto por Surtido (Mayor a Menor)
            let isExpanded = expandedState['master-table'];
            let visibleList = isExpanded ? list : list.slice(0, 10);

            document.getElementById('table-view-status').innerText = isExpanded ? 'Universo Operativo Completo' : 'Top 10 por Volumen Surtido';
            document.getElementById('btnTableText').innerText = isExpanded ? 'Contraer Vista Detallada' : 'Ver Todos los Despachos';
            document.getElementById('btnTableArrow').innerText = isExpanded ? '▲' : '▼';

            const tbody = document.getElementById('masterTableBody');
            tbody.innerHTML = '';

            if (visibleList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center italic text-slate-500">Sin datos que cumplan las condiciones del filtro.</td></tr>`;
                return;
            }

            visibleList.forEach(c => {
                let dbe = c.s > 0 ? (c.r / c.s * 100) : 0;
                let textRateColor = dbe > dbeMeta ? 'text-rose-400 font-bold' : 'text-emerald-400 font-bold';

                let tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/40 transition-colors border-b border-slate-800/40";
                tr.innerHTML = `
                    <td class="p-2 font-mono text-slate-400 text-[10px]">${c.cod}</td>
                    <td class="p-2 font-medium text-slate-200 truncate max-w-[140px]" title="${c.name}">${c.name}</td>
                    <td class="p-2 text-slate-400 font-medium">${c.ruta}</td>
                    <td class="p-2 text-slate-400">${c.canal}</td>
                    <td class="p-2 font-mono text-slate-300 text-[10px]">${c.veh}</td>
                    <td class="p-2 truncate max-w-[120px] text-amber-500/90 font-medium" title="${c.mot}">${c.mot}</td>
                    <td class="p-2 text-right font-mono font-semibold text-slate-300">${Math.round(c.s).toLocaleString('es-PE')}</td>
                    <td class="p-2 text-right font-mono ${c.r > 0 ? 'text-rose-400 font-bold' : 'text-slate-500'}">${Math.round(c.r).toLocaleString('es-PE')}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // NUEVA FUNCIÓN: Dibuja dinámicamente las ubicaciones en el Mapa Oscuro de Leaflet según las coordenadas
        function renderMapMarkers(dataset) {
            if (!markersGroup) return;
            markersGroup.clearLayers();

            let recordsWithRechazo = dataset.filter(x => x.rechazado > 0);
            
            recordsWithRechazo.forEach(p => {
                let rate = p.s > 0 ? (p.rechazado / p.s * 100) : 0;
                let markerColor = rate > dbeMeta ? '#f43f5e' : '#10b981';

                // Crear un círculo interactivo para representar el punto operativo del cliente
                let circleMarker = L.circleMarker([p.lat, p.lng], {
                    radius: Math.max(4, Math.min(rate * 2, 12)), // El tamaño del punto varía proporcionalmente al % DBE
                    fillColor: markerColor,
                    color: '#0f172a',
                    weight: 1.5,
                    opacity: 1,
                    fillOpacity: 0.8
                });

                let popupContent = `
                    <div style="font-family:'Inter',sans-serif; font-size:11px; color:#1e293b; line-height:1.4;">
                        <b style="color:#4f46e5; text-transform:uppercase;">${p.cliente}</b><br/>
                        <b>Ruta:</b> ${p.rutaVenta} | <b>Vehículo:</b> ${p.vehiculo}<br/>
                        <b>Rechazado:</b> <span style="color:#e11d48;font-weight:bold;">${Math.round(p.rechazado)} Kg</span> / ${Math.round(p.surtido)} Kg<br/>
                        <b>Motivo:</b> <span style="color:#d97706;">${p.motivo}</span><br/>
                        <b>% DBE:</b> <span style="font-weight:black;color:${rate > dbeMeta ? '#e11d48' : '#059669'};">${rate.toFixed(2)}%</span>
                    </div>
                `;

                circleMarker.bindPopup(popupContent);
                markersGroup.addLayer(circleMarker);
            });

            // Si hay puntos en el mapa, auto-ajustar el encuadre para enfocar la zona crítica activa de Lima
            if (recordsWithRechazo.length > 0) {
                let coordsArray = recordsWithRechazo.map(x => [x.lat, x.lng]);
                mapInstance.fitBounds(coordsArray, { padding: [20, 20], maxZoom: 14 });
            }
        }

        function renderTrendChart(dataTrend) {
            let fMap = {};
            dataTrend.forEach(r => {
                if(!fMap[r.numDia]) fMap[r.numDia] = {s:0, r:0};
                fMap[r.numDia].s += r.surtido; fMap[r.numDia].r += r.rechazado;
            });
            let sortedDays = Object.keys(fMap).sort((a,b) => parseInt(a) - parseInt(b));
            if(trendChart) trendChart.destroy();
            const ctx = document.getElementById('chartTrend').getContext('2d');
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: sortedDays,
                    datasets: [{
                        label: '% DBE Diario', data: sortedDays.map(d => fMap[d].s > 0 ? (fMap[d].r / fMap[d].s * 100).toFixed(2) : 0),
                        borderColor: '#6366f1', backgroundColor: 'rgba(99, 102, 241, 0.01)', borderWidth: 2, fill: true, tension: 0.1, pointRadius: 3
                    }]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { beginAtZero: true, ticks: { color: '#94a3b8', callback: v => v + '%' }, grid: { color: '#334155/15' } },
                        x: { ticks: { color: '#94a3b8' }, grid: { display: false } }
                    }
                }
            });
        }
    </script>
</body>
</html>
